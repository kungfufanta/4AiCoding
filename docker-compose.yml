# sandboxd — full stack, runs entirely on Docker.
#
#   traefik   edge router; turns each sandbox's labels into an HTTPS-or-
#             HTTP preview route and wakes stopped sandboxes on demand.
#   console   web UI (console/): static SPA + same-origin /v1 proxy, at
#             http://console.${PREVIEW_DOMAIN}.
#   sandboxd  control plane; creates/stops/destroys sandbox containers by
#             shelling out to the host Docker daemon over the mounted
#             socket, stores state in SQLite, runs the idle/pressure
#             reapers and the wake path.
#
# Per-sandbox containers are NOT services here — sandboxd launches them
# at runtime from the prebuilt ${SANDBOXD_IMAGE}. They join the same
# ${SANDBOXD_NETWORK} so Traefik can route to them.
#
# Networks (PLAN §8 #5, #13): sandboxes live on ${SANDBOXD_NETWORK}, an
# internal network with no route out; their only way out is the egress proxy
# (http://sandboxd-egress:3128, injected as HTTP(S)_PROXY). The control
# plane is reached ONLY over sandboxd_ctl, as http://sandboxd-ctl:9000. It also
# sits on the sandbox network (it probes a waking sandbox's port) but refuses
# every request whose source is in that network.
#
# Everything is parameterised from .env (see .env.example).

networks:
  sandboxd_net:
    # Explicit name so the literal string also works as the --network
    # value sandboxd passes to `docker run` for each sandbox.
    name: ${SANDBOXD_NETWORK:-sandboxd_net}
    # No route out (PLAN §8 #5): a sandbox reaches the internet only through
    # sandboxd's egress proxy (alias sandboxd-egress below), which enforces
    # each sandbox's allowlist. Set SANDBOXD_NETWORK_INTERNAL=false to give
    # sandboxes direct, unfiltered internet access instead.
    internal: ${SANDBOXD_NETWORK_INTERNAL:-true}
  sandboxd_ctl:
    # Edge router <-> control plane only. Sandboxes never join it.
    name: sandboxd_ctl

services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    # Run the edge + control plane in the HOST user namespace. They are
    # infrastructure that needs host-level access to the Docker socket and
    # (for sandboxd) to the data dir that sandboxes bind-mount. On a
    # daemon WITHOUT userns-remap this is a no-op; on one WITH it enabled
    # it keeps these two containers working. Per-sandbox containers are
    # NOT listed here, so they keep the daemon's default isolation.
    userns_mode: "host"
    command:
      - "--configfile=/etc/traefik/traefik.yml"
    ports:
      # Plain HTTP by default. Browsers resolve *.localhost to 127.0.0.1,
      # so http://s-<id>-<port>.preview.localhost:${HTTP_PORT} just works.
      - "${HTTP_PORT:-80}:80"
      # Uncomment for a TLS deployment (set PREVIEW_TLS=true and supply a
      # cert to the default store via traefik/dynamic/).
      # - "${HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ${SANDBOXD_LOG_DIR:-/var/lib/sandboxd/log}:${SANDBOXD_LOG_DIR:-/var/lib/sandboxd/log}
    networks:
      - sandboxd_ctl
      - sandboxd_net

  sandboxd:
    build:
      context: ./control-plane
      args:
        # Stamped into the binary (sandboxd version / telemetry / settings).
        # Set SANDBOXD_VERSION / SANDBOXD_GIT_COMMIT (e.g. from `git describe`); default dev.
        VERSION: ${SANDBOXD_VERSION:-dev}
        GIT_COMMIT: ${SANDBOXD_GIT_COMMIT:-unknown}
    # The installer records verified release image names in .env; source
    # builds keep local defaults or the operator's explicit image names.
    image: ${SANDBOXD_CONTROL_PLANE_IMAGE:-sandboxd-control-plane:0.3.0}
    restart: unless-stopped
    userns_mode: "host"  # see traefik above
    # Reachable by Traefik as http://sandboxd-ctl:9000 (control network). The API
    # is also published to the loopback for local use / the upstream
    # backend; change SANDBOXD_API_BIND in .env if 127.0.0.1:9090 clashes.
    ports:
      - "${SANDBOXD_API_BIND:-127.0.0.1:9090}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Symmetric data-dir mount: the path sandboxd writes is ALSO a valid
      # host path, so the sibling `docker run -v <workspace>:/home/sandbox`
      # resolves on the host daemon. Do not change one side without the other.
      - ${SANDBOXD_DATA_DIR:-/var/lib/sandboxd}:${SANDBOXD_DATA_DIR:-/var/lib/sandboxd}
      - ${SANDBOXD_LOG_DIR:-/var/lib/sandboxd/log}:${SANDBOXD_LOG_DIR:-/var/lib/sandboxd/log}
      # Domain manager: custom certificates (POST /v1/domain/certificates)
      # are written here as Traefik file-provider config.
      - ./traefik/dynamic:/etc/traefik/dynamic
    environment:
      # --- core ---
      PREVIEW_DOMAIN: ${PREVIEW_DOMAIN:-localhost}
      SANDBOXD_IMAGE: ${SANDBOXD_IMAGE:-sandboxd-base:0.3.0}
      SANDBOXD_NETWORK: ${SANDBOXD_NETWORK:-sandboxd_net}
      SANDBOXD_USERNS: ${SANDBOXD_USERNS:-host}
      SANDBOXD_IMAGE_ALLOWLIST: ${SANDBOXD_IMAGE_ALLOWLIST:-}
      SANDBOXD_SANDBOX_USER: ${SANDBOXD_SANDBOX_USER:-1000:1000}
      SANDBOXD_DEFAULT_MEMORY_MB: ${SANDBOXD_DEFAULT_MEMORY_MB:-10240}
      SANDBOXD_MAX_MEMORY_MB: ${SANDBOXD_MAX_MEMORY_MB:-10240}
      SANDBOXD_MAX_CPUS: ${SANDBOXD_MAX_CPUS:-0}
      SANDBOXD_MAX_PORTS_PER_SANDBOX: ${SANDBOXD_MAX_PORTS_PER_SANDBOX:-16}
      SANDBOXD_SANDBOX_NOFILE: ${SANDBOXD_SANDBOX_NOFILE:-65536}
      # Sandbox container runtime: empty = docker default (runc); "runsc" = gVisor
      # (stronger per-sandbox kernel isolation). SANDBOXD_DNS overrides resolv.conf
      # for gVisor sandboxes (netstack can't reach Docker's embedded DNS).
      SANDBOXD_RUNTIME: ${SANDBOXD_RUNTIME:-}
      SANDBOXD_DNS: ${SANDBOXD_DNS:-}
      SANDBOXD_DATA_DIR: ${SANDBOXD_DATA_DIR:-/var/lib/sandboxd}
      SANDBOXD_LOG_DIR: ${SANDBOXD_LOG_DIR:-/var/lib/sandboxd/log}
      SANDBOXD_ACCESS_LOG: ${SANDBOXD_LOG_DIR:-/var/lib/sandboxd/log}/traefik-access.log
      # --- routing (HTTP by default) ---
      PREVIEW_ENTRYPOINT: ${PREVIEW_ENTRYPOINT:-web}
      PREVIEW_TLS: ${PREVIEW_TLS:-false}
      # Useful when TLS terminates upstream (for example at a Kubernetes ingress):
      # routes here remain HTTP while generated public URLs stay HTTPS.
      PREVIEW_URL_SCHEME: ${PREVIEW_URL_SCHEME:-}
      # Hostname layout under PREVIEW_DOMAIN (see .env.example).
      PREVIEW_HOST_STYLE: ${PREVIEW_HOST_STYLE:-nested}
      PREVIEW_HOST_TAG: ${PREVIEW_HOST_TAG:-}
      # Host-facing port previews/console are reached on; appended to preview
      # URLs unless it's the scheme default (80/443). Matches HTTP_PORT so a
      # shared-host deploy (e.g. 18080) returns a reachable URL.
      SANDBOXD_PUBLIC_HTTP_PORT: ${HTTP_PORT:-80}
      # --- portability toggles ---
      SANDBOXD_SET_MEMORY_HIGH: ${SANDBOXD_SET_MEMORY_HIGH:-false}
      # --- auth ---
      # Auth is ON by default — every /v1 request needs a console session or an
      # API key (no loopback bypass). The installer seeds a bootstrap key in
      # SANDBOXD_API_TOKENS. Set SANDBOXD_API_AUTH_DISABLED=true only as an
      # explicit rollback (it trips the "your API is open" warning).
      SANDBOXD_API_AUTH_DISABLED: ${SANDBOXD_API_AUTH_DISABLED:-false}
      SANDBOXD_API_TOKENS: ${SANDBOXD_API_TOKENS:-}
      # First admin user, "username:password" (only used while no user exists).
      SANDBOXD_BOOTSTRAP_ADMIN: ${SANDBOXD_BOOTSTRAP_ADMIN:-}
      SANDBOXD_API_KEY_MAX_TTL_SECONDS: ${SANDBOXD_API_KEY_MAX_TTL_SECONDS:-0}
      SANDBOXD_TRAEFIK_DYNAMIC_DIR: /etc/traefik/dynamic
      # --- fleet (M6) ---
      # Workers call POST /internal/nodes/* with this bearer token. Empty =
      # the fleet door stays closed (workers cannot register).
      SANDBOXD_WORKER_TOKEN: ${SANDBOXD_WORKER_TOKEN:-}
      SANDBOXD_NODE_ID: ${SANDBOXD_NODE_ID:-}
      SANDBOXD_NODE_LEASE_SECONDS: ${SANDBOXD_NODE_LEASE_SECONDS:-}
      SANDBOXD_CAPACITY_CPUS: ${SANDBOXD_CAPACITY_CPUS:-}
      SANDBOXD_CAPACITY_MEMORY_MB: ${SANDBOXD_CAPACITY_MEMORY_MB:-}
      SANDBOXD_CAPACITY_DISK_MB: ${SANDBOXD_CAPACITY_DISK_MB:-}
      # Host telemetry of this machine (CPU/RAM/disk/net, docs/NODE_RESOURCES.md).
      # On by default; "off" disables it. Disk defaults to the data dir.
      SANDBOXD_TELEMETRY: ${SANDBOXD_TELEMETRY:-}
      SANDBOXD_TELEMETRY_DISK_PATH: ${SANDBOXD_TELEMETRY_DISK_PATH:-}
      # Capacity change requests as pull requests on the deploy repo (GitOps).
      # NODE_FILES maps node ids to Helm values files, e.g.
      # "k3s-1=deploy/k3s-1-values.yaml"; empty = feature off. Without a
      # token the console only previews the edit. The token needs Contents +
      # Pull requests write on that one repo, nothing else.
      SANDBOXD_GITOPS_NODE_FILES: ${SANDBOXD_GITOPS_NODE_FILES:-}
      SANDBOXD_GITOPS_REPO: ${SANDBOXD_GITOPS_REPO:-}
      SANDBOXD_GITOPS_TOKEN: ${SANDBOXD_GITOPS_TOKEN:-}
      SANDBOXD_GITOPS_BASE: ${SANDBOXD_GITOPS_BASE:-main}
      # --- egress (PLAN §8 #5) ---
      SANDBOXD_EGRESS_PROXY_ADDR: ${SANDBOXD_EGRESS_PROXY_ADDR:-:3128}
      SANDBOXD_EGRESS_PROXY_URL: ${SANDBOXD_EGRESS_PROXY_URL:-http://sandboxd-egress:3128}
      # --- idle lifecycle (override if you like) ---
      SANDBOXD_IDLE_THRESHOLD_SECONDS: ${SANDBOXD_IDLE_THRESHOLD_SECONDS:-2100}
    networks:
      sandboxd_ctl:
        aliases: [sandboxd-ctl]
      sandboxd_net:
        aliases: [sandboxd-egress]

  console:
    # The web console: static SPA + same-origin /v1 proxy to sandboxd.
    # Reached through Traefik at http://console.${PREVIEW_DOMAIN}.
    build:
      context: ./console
    image: ${SANDBOXD_CONSOLE_IMAGE:-sandboxd-console:0.4.0}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [sandboxd]
    networks:
      # Control network only: sandboxes can never reach the console.
      sandboxd_ctl:
        aliases: [sandboxd-console]
