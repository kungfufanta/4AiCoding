openapi: 3.0.3
info:
  title: 4AiCoding sandboxd /v1 API
  version: "0.5.0-fleet"
  description: >
    The public sandbox-lifecycle API of the 4AiCoding control plane. This is the only surface a
    console or external integration should use — the internal /sandbox and
    /wake endpoints are not part of this contract. Scoped by the API token
    (Bearer); when an operator explicitly disables auth, the whole
    surface is reachable without a token.
servers:
  - url: http://127.0.0.1:9090
    description: Default loopback bind (docker-compose maps SANDBOXD_API_BIND here)
security:
  - bearerAuth: []
  - {} # only when auth is explicitly disabled by the operator

tags:
  - name: instance
  - name: auth
  - name: sandboxes
  - name: snapshots
  - name: network
  - name: observability
  - name: nodes

paths:
  /version:
    get:
      operationId: getVersion
      summary: Build version and commit (no auth; for monitoring and upgrade checks)
      security: []
      responses:
        "200":
          description: Build identity
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [version, commit]
                properties:
                  version: { type: string, example: v0.3.15 }
                  commit: { type: string, example: 1a2b3c4d5e6f }
  /v1/settings:
    get:
      operationId: getSettings
      tags: [instance]
      summary: Read-only instance/settings summary (safe metadata only; no secrets)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    patch:
      operationId: updateSettings
      tags: [instance]
      summary: Edit the runtime-editable settings (allowlisted)
      description: >
        Accepts ONLY the allowlisted editable fields: the lifecycle tunables.
        Any other key (auth, egress, networking, secrets,
        version, …) is rejected with 400. Persisted and hot-applied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lifecycle:
                  type: object
                  properties:
                    idle_reap_enabled: { type: boolean }
                    idle_threshold_seconds: { type: integer }
                    keepalive_max_seconds: { type: integer }
      responses:
        "200":
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/Error" }
        "503":
          description: Settings are not editable on this instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/status:
    get:
      operationId: authStatus
      tags: [auth]
      summary: Console auth status — is auth enabled, is the caller authenticated, does the first admin still need to be created (pre-login probe, no credential required)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  authenticated: { type: boolean }
                  password_set: { type: boolean, description: deprecated alias of !setup_needed }
                  setup_needed: { type: boolean }
  /v1/auth/setup:
    post:
      operationId: authSetup
      tags: [auth]
      summary: First run — create the first admin user and start a session. 409 once any user exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                username: { type: string, default: admin }
                password: { type: string, description: min 8 chars }
      responses:
        "204": { description: Admin created; session cookie issued }
        "400": { description: Password too short / invalid body }
        "409": { description: A user already exists }
  /v1/auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Sign in as a console user and receive an HttpOnly session cookie. Unsafe requests made with the cookie must carry the header X-Sandboxd-CSRF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                username: { type: string, default: admin }
                password: { type: string }
      responses:
        "204": { description: Authenticated; session cookie issued }
        "401": { description: Invalid username or password }
  /v1/auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Revoke the current session (or with ?all=true every session of this user) and clear the cookie
      parameters:
        - { name: all, in: query, schema: { type: boolean } }
      responses:
        "204": { description: Logged out }
  /v1/auth/password:
    post:
      operationId: authChangePassword
      tags: [auth]
      summary: Change the signed-in user's password; revokes that user's sessions and re-issues one
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, description: min 8 chars }
      responses:
        "204": { description: Password changed }
        "400": { description: New password too short / invalid body }
        "401": { description: Current password incorrect }
        "403": { description: Not logged in as a console user }
    delete:
      operationId: authResetPassword
      tags: [auth]
      summary: Delete every console user and session so the next visit runs first-run setup again. Admin API keys only — a console session is refused.
      responses:
        "204": { description: Password cleared and all sessions revoked }
        "401": { description: No credential }
        "403": { description: Caller is a console session, not an API key }
  /v1/api-keys:
    post:
      operationId: createApiKey
      tags: [auth]
      summary: Mint an API key. The plaintext key is returned exactly once. Admin only.
      description: |
        A key acts with `role` (default admin; never above its creator's).
        `scopes` further restricts what it may call (omitted = everything its
        role allows): `health` (health/version/status probes only),
        `sandboxes:read`, `sandboxes:write`, `sandboxes:exec`, `snapshots`,
        `sandboxes:egress`, `sandboxes:files`. `sandbox_id` binds the key to
        one sandbox's routes.
        `ttl_seconds` makes it expire (capped by SANDBOXD_API_KEY_MAX_TTL_SECONDS).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: 1-64 printable chars }
                scopes:
                  type: array
                  items: { type: string, enum: [health, "sandboxes:read", "sandboxes:write", "sandboxes:exec", snapshots, "sandboxes:egress", "sandboxes:files"] }
                  description: Optional restriction; omitted = everything the role allows
                role: { $ref: "#/components/schemas/Role" }
                ttl_seconds: { type: integer }
                sandbox_id: { type: string }
                require_external:
                  type: boolean
                  description: "PORTAL S3a — every sandbox create with this key must carry external.workspace_id (400 workspace_required otherwise)."
      responses:
        "201":
          description: Created — plaintext key returned once
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  prefix: { type: string }
                  scopes: { type: array, items: { type: string } }
                  key: { type: string, description: plaintext — shown only here }
        "400": { description: Invalid name or unknown scope }
        "403": { description: Requires a console login }
        "409": { description: A key with that name already exists }
    get:
      operationId: listApiKeys
      tags: [auth]
      summary: List API keys (metadata only — never the key or its hash). Session-only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        prefix: { type: string }
                        created_at: { type: string }
                        last_used_at: { type: string }
                        scopes: { type: array, items: { type: string }, description: empty = full access }
                        require_external: { type: boolean, description: "PORTAL S3a — creates must tag external.workspace_id" }
        "403": { description: Requires a console login }
  /v1/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      tags: [auth]
      summary: Revoke an API key. Session-only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "403": { description: Requires a console login }
        "404": { description: No such key }

  /v1/sandboxes:
    get:
      operationId: listSandboxes
      tags: [sandboxes]
      summary: List sandboxes, newest first
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [creating, running, stopped, error] } }
        - { name: external_user_id, in: query, schema: { type: string } }
        - { name: external_project_id, in: query, schema: { type: string } }
        - { name: external_workspace_id, in: query, schema: { type: string }, description: "Only sandboxes tagged with this workspace (the caller's tenant, PORTAL S3a)." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sandboxes: { type: array, items: { $ref: "#/components/schemas/Sandbox" } }
                  unreachable_nodes:
                    type: array
                    items: { type: string }
                    description: Executor workers that did not answer; their sandboxes are missing from this page.
    post:
      operationId: createSandbox
      tags: [sandboxes]
      summary: Create a sandbox
      description: >-
        The control plane places the sandbox on the schedulable node with the
        most free memory: itself, or an executor worker (M7b). The response's
        `node` names it; every /v1/sandboxes/{id} call is then routed there.
        A create from a snapshot always runs on the control plane.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSandboxRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "400": { $ref: "#/components/responses/Error" }
        "503":
          description: Capacity pushback (Retry-After).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/sandboxes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getSandbox
      tags: [sandboxes]
      summary: Get a sandbox
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSandbox
      tags: [sandboxes]
      summary: Destroy the sandbox (container + workspace + row)
      responses:
        "204": { description: Destroyed }
        "404": { $ref: "#/components/responses/Error" }

  /v1/sandboxes/{id}/start:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    post:
      operationId: startSandbox
      tags: [sandboxes]
      summary: Start (wake) a stopped sandbox. Idempotent when running.
      responses:
        "200":
          description: Running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503":
          description: Capacity pushback (Retry-After).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/sandboxes/{id}/stop:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    post:
      operationId: stopSandbox
      tags: [sandboxes]
      summary: Stop a running sandbox (frees RAM; wakes on start). Idempotent when stopped.
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/sandboxes/{id}/restart:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    post:
      operationId: restartSandbox
      tags: [sandboxes]
      summary: Stop (if running) then start the sandbox.
      responses:
        "200":
          description: Running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/sandboxes/{id}/exec:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    post:
      operationId: execSandbox
      tags: [sandboxes]
      summary: >-
        Run a one-shot command in a running sandbox. A non-zero exit code is
        still 200. A bare {cmd} request keeps the legacy behaviour (no
        timeout, unbounded output buffers); presence of any v2 field
        (cwd/env/stdin/timeout_s/max_output_bytes) switches to exec v2
        semantics (AGENT_PLAN A0).
      parameters:
        - { name: stream, in: query, schema: { type: string, enum: [ndjson] }, description: "stream=ndjson streams the run as newline-delimited JSON instead of one buffered response" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cmd]
              properties:
                cmd: { type: array, items: { type: string }, minItems: 1 }
                cwd:
                  type: string
                  description: Working directory inside the sandbox; must be under /home/sandbox
                env:
                  type: object
                  description: Extra env vars (K=V). PATH, HOME and LD_* may not be overridden.
                  additionalProperties: { type: string }
                stdin:
                  type: string
                  description: Optional stdin payload, max 1 MiB
                timeout_s:
                  type: integer
                  default: 60
                  description: Hard in-container timeout; the whole process group is killed. Capped by policy.exec.max_timeout_s (default 600).timed_out=true and exit_code=124 on expiry.
                max_output_bytes:
                  type: integer
                  format: int64
                  default: 262144
                  description: Per-stream output bound (head+tail kept, truncated=true). Max 4 MiB.
      responses:
        "200":
          description: Command finished (or an ndjson stream when stream=ndjson)
          content:
            application/json:
              schema:
                type: object
                properties:
                  stdout: { type: string }
                  stderr: { type: string }
                  exit_code: { type: integer }
                  timed_out: { type: boolean }
                  truncated: { type: boolean }
                  duration_ms: { type: integer, format: int64 }
            application/x-ndjson:
              schema:
                type: string
                description: One {"stream":"stdout"|"stderr","data":"…"} JSON line per chunk, final line {"exit_code":…,"timed_out":…,"duration_ms":…}
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/sandboxes/{id}/logs:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      operationId: sandboxLogs
      tags: [sandboxes]
      summary: Container stdout+stderr. follow=true streams Server-Sent Events.
      parameters:
        - { name: tail, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 200 } }
        - { name: follow, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Log lines (text/plain), or an SSE stream with one `data:` line per log line when follow=true.
          content:
            text/plain: { schema: { type: string } }
            text/event-stream: { schema: { type: string } }
        "404": { $ref: "#/components/responses/Error" }

  /v1/sandboxes/{id}/files:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      operationId: listSandboxFiles
      tags: [files]
      summary: >-
        List workspace files (relative to /home/sandbox). Symlinks are never
        listed or followed; node_modules, .git, .venv, dist and .vite are
        skipped in recursive listings. Scope: sandboxes:files.
      parameters:
        - { name: path, in: query, schema: { type: string }, description: Directory to list, relative to the workspace root (default root) }
        - { name: recursive, in: query, schema: { type: boolean, default: false } }
        - { name: max_entries, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 500 } }
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  recursive: { type: boolean }
                  truncated: { type: boolean, description: max_entries was hit — entries are partial }
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        type: { type: string, enum: [file, dir] }
                        size: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSandboxFile
      tags: [files]
      summary: Delete a file or an EMPTY directory. Scope: sandboxes:files.
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/sandboxes/{id}/files/content:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      operationId: readSandboxFile
      tags: [files]
      summary: >-
        Read file content as UTF-8 text or base64 (binary). One request is
        capped at 2 MiB — larger files page with offset/limit.
        Scope: sandboxes:files.
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, maximum: 2097152 }, description: Window size; omitted reads the whole file up to the 2 MiB cap }
      responses:
        "200":
          description: File content window
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  size: { type: integer, format: int64 }
                  offset: { type: integer, format: int64 }
                  encoding: { type: string, enum: [utf-8, base64] }
                  data: { type: string }
                  truncated: { type: boolean, description: more content remains beyond this window }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: writeSandboxFile
      tags: [files]
      summary: >-
        Write a whole file (parent dirs are created). Body is opaque bytes
        (max 25 MiB); files land 0644 owned by the sandbox user — no
        host-side exec bits. Optional if_match (sha256 of the current
        content) refuses clobbering writes. Scope: sandboxes:files.
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: if_match, in: query, schema: { type: string }, description: sha256 hex of the current content; mismatch (or missing file) answers 409 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  size: { type: integer, format: int64 }
                  sha256: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  /v1/sandboxes/{id}/files/move:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    post:
      operationId: moveSandboxFile
      tags: [files]
      summary: Rename/move a file or directory within the workspace; the target must not exist. Scope: sandboxes:files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string }
                to: { type: string }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: string }
                  to: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/sandboxes/{id}/network/ports:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      operationId: listSandboxPorts
      tags: [network]
      summary: Preview ports of a sandbox, with their URLs
      responses:
        "200": { $ref: "#/components/responses/Ports" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: replaceSandboxPorts
      tags: [network]
      summary: Replace the preview ports. A running sandbox is restarted on a rebuilt container.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ports]
              additionalProperties: false
              properties:
                ports: { type: array, items: { $ref: "#/components/schemas/PortRequest" } }
      responses:
        "200": { $ref: "#/components/responses/Ports" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    post:
      operationId: addSandboxPort
      tags: [network]
      summary: Add one preview port (idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortRequest" }
      responses:
        "200": { $ref: "#/components/responses/Ports" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/sandboxes/{id}/network/ports/{port}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: port, in: path, required: true, schema: { type: integer } }
    delete:
      operationId: deleteSandboxPort
      tags: [network]
      summary: Remove one preview port
      responses:
        "200": { $ref: "#/components/responses/Ports" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/sandboxes/{id}/metrics:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      operationId: sandboxMetrics
      tags: [observability]
      summary: One resource sample (CPU, memory, network, block IO, pids). Zeros while stopped.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Metrics" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/sandboxes/{id}/metrics/stream:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      operationId: sandboxMetricsStream
      tags: [observability]
      summary: Metrics samples as Server-Sent Events, one `data:` Metrics object per interval
      parameters:
        - { name: interval, in: query, schema: { type: integer, minimum: 1, maximum: 60, default: 2 } }
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/sandboxes/{id}/volumes:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      operationId: sandboxVolumes
      tags: [observability]
      summary: What is mounted into the sandbox. Host paths are never returned.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  volumes:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, example: workspace }
                        destination: { type: string, example: /home/sandbox }
                        read_only: { type: boolean }
                        used_bytes: { type: integer, format: int64 }
        "404": { $ref: "#/components/responses/Error" }

  /v1/snapshots:
    get:
      operationId: listSnapshots
      tags: [snapshots]
      summary: List snapshots (tenant-scoped)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots:
                    type: array
                    items: { $ref: "#/components/schemas/Snapshot" }
    post:
      operationId: createSnapshot
      tags: [snapshots]
      summary: Capture a snapshot of a stopped sandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_sandbox_id, name]
              properties:
                source_sandbox_id: { type: string }
                name: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "409":
          description: Source sandbox is running; stop it first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/snapshots/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      operationId: getSnapshot
      tags: [snapshots]
      summary: Get a snapshot
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSnapshot
      tags: [snapshots]
      summary: Delete a snapshot
      responses:
        "204": { description: Deleted }

  /v1/auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Who the caller is — kind (user/service), user, role, and for API keys the scopes and sandbox binding
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string, enum: [user, service] }
                  user: { type: string }
                  role: { $ref: "#/components/schemas/Role" }
                  sandbox_id: { type: string }
                  scopes: { type: array, items: { type: string } }

  /v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List console users. Admin only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/User" } }
    post:
      operationId: createUser
      tags: [users]
      summary: Create a console user. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: { type: string, description: "1-64 chars: letters, digits, . _ -" }
                password: { type: string, description: min 8 chars }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { description: Username taken }
  /v1/users/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    patch:
      operationId: updateUser
      tags: [users]
      summary: Change a user's role, disable/enable it, or set a new password. Revokes that user's sessions. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: "#/components/schemas/Role" }
                disabled: { type: boolean }
                password: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: Would leave no active admin }
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user and its sessions. Admin only.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: Would leave no active admin }

  /v1/audit:
    get:
      operationId: listAudit
      tags: [audit]
      summary: Audit log, newest first. Admin only.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { name: before, in: query, description: Return entries with id < before (paging), schema: { type: integer } }
        - { name: action, in: query, schema: { type: string } }
        - { name: target, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
  /v1/audit/verify:
    get:
      operationId: verifyAudit
      tags: [audit]
      summary: Recompute the audit hash chain and report the first broken row (edited or deleted entries). Admin only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  checked: { type: integer }
                  unchained: { type: integer, description: rows written before the chain existed }
                  broken_at: { type: integer }
                  reason: { type: string }

  /v1/domain:
    get:
      operationId: getDomain
      tags: [domain]
      summary: The stored domain / TLS mode, what is running, and whether a restart is needed to apply it
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
    put:
      operationId: putDomain
      tags: [domain]
      summary: Set the domain and TLS mode (off, custom, letsencrypt). Stored; applied at the next start of sandboxd. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
                tls_mode: { type: string, enum: [off, custom, letsencrypt], default: off }
                acme_email: { type: string }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/domain/verify:
    post:
      operationId: verifyDomain
      tags: [domain]
      summary: Resolve the console host and a random preview host (proves the wildcard record), optionally against expected IPs. Admin only.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expect_ips: { type: array, items: { type: string } }
      responses:
        "200":
          description: Result (ok=false with a hint when records are missing or wrong)
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: { type: string }
                  ok: { type: boolean }
                  hint: { type: string }
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        host: { type: string }
                        addrs: { type: array, items: { type: string } }
                        ok: { type: boolean }
                        error: { type: string }
        "400": { description: localhost needs no DNS }
  /v1/domain/certificates:
    get:
      operationId: listCertificates
      tags: [domain]
      summary: Custom certificates installed for Traefik (metadata only, never keys)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  certificates: { type: array, items: { $ref: "#/components/schemas/Certificate" } }
    post:
      operationId: addCertificate
      tags: [domain]
      summary: Install a PEM certificate + key covering the console host and the preview wildcard; it becomes Traefik's default certificate. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cert_pem, key_pem]
              properties:
                cert_pem: { type: string }
                key_pem: { type: string }
      responses:
        "201":
          description: Installed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "400": { description: Invalid pair, expired, or does not cover the hosts }
        "503": { description: Certificate storage not configured }

  /v1/policy:
    get:
      operationId: getPolicy
      tags: [policy]
      summary: The instance policy every sandbox request is checked against
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
    put:
      operationId: putPolicy
      tags: [policy]
      summary: Replace the instance policy. Admin only. Returns 202 when the current policy gates policy.update behind an approval.
      parameters: [ { $ref: "#/components/parameters/ApprovalHeader" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Policy" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "202": { $ref: "#/components/responses/ApprovalPending" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/policy/{section}:
    parameters:
      - { name: section, in: path, required: true, schema: { type: string, enum: [images, ports, resources, egress, lifecycle, approvals] } }
    get:
      operationId: getPolicySection
      tags: [policy]
      summary: One section of the policy
      responses:
        "200": { description: The section's JSON }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: putPolicySection
      tags: [policy]
      summary: Replace one section of the policy. Admin only.
      parameters: [ { $ref: "#/components/parameters/ApprovalHeader" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Saved; returns the whole policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "202": { $ref: "#/components/responses/ApprovalPending" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/sandboxes/{id}/lifecycle:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      operationId: getSandboxLifecycle
      tags: [sandboxes]
      summary: The sandbox's idle timeout and keep-alive flag
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lifecycle" }
    patch:
      operationId: patchSandboxLifecycle
      tags: [sandboxes]
      summary: Change the idle timeout (0 = instance default; clamped by policy) or keep-alive (denied unless the policy allows it)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Lifecycle" }
      responses:
        "200":
          description: Applied values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lifecycle" }
        "403": { $ref: "#/components/responses/PolicyDenied" }
  /v1/sandboxes/{id}/keep-alive:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    post:
      operationId: keepAliveOn
      tags: [sandboxes]
      summary: Exempt the sandbox from the idle reaper (policy lifecycle.allow_keep_alive)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lifecycle" }
        "403": { $ref: "#/components/responses/PolicyDenied" }
    delete:
      operationId: keepAliveOff
      tags: [sandboxes]
      summary: Return the sandbox to the idle reaper
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lifecycle" }
  /v1/sandboxes/{id}/network/egress:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      operationId: getSandboxEgress
      tags: [network]
      summary: The sandbox's outbound allowlist and the proxy it must use
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Egress" }
    put:
      operationId: putSandboxEgress
      tags: [network]
      summary: >-
        Change the sandbox's network mode and lists. mode is none (nothing
        leaves), allowlist (only allow entries) or open (everything except
        deny entries); deny always wins, also against the addresses an allowed
        name resolves to. Entries are hosts, *.domains, IPs or CIDRs. Omitted
        fields keep their current value. Under a strict policy, allow entries
        outside the policy allowlist and mode open are denied, or return 202
        when policy gates sandbox.egress_outside_policy behind an approval.
        Applies to the next connection, no restart.
      parameters: [ { $ref: "#/components/parameters/ApprovalHeader" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [none, allowlist, open] }
                allow: { type: array, items: { type: string } }
                deny: { type: array, items: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Egress" }
        "202": { $ref: "#/components/responses/ApprovalPending" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/PolicyDenied" }

  /v1/sandboxes/{id}/network/activity:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      operationId: getSandboxNetworkActivity
      tags: [network]
      summary: >-
        Live network view: every request the sandbox made through the egress
        proxy after the given cursor, a per-host summary, and the current
        rules. Kept in memory (bounded, cleared on restart). Poll with the
        returned cursor.
      parameters:
        - { name: after, in: query, schema: { type: string }, description: Cursor from the previous response; omit for everything kept }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkActivity" }

  /v1/approvals:
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: Approval requests, newest first
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, denied, used, expired] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvals: { type: array, items: { $ref: "#/components/schemas/Approval" } }
  /v1/approvals/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      operationId: getApproval
      tags: [approvals]
      summary: One approval request
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/approvals/{id}/approve:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    post:
      operationId: approveApproval
      tags: [approvals]
      summary: Approve a pending request. Admin console users only — API keys can never approve.
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "403": { description: Caller is not a console user }
        "409": { description: Not pending any more }
  /v1/approvals/{id}/deny:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    post:
      operationId: denyApproval
      tags: [approvals]
      summary: Deny a pending request. Admin console users only.
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        "200":
          description: Denied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "403": { description: Caller is not a console user }
        "409": { description: Not pending any more }

  /v1/nodes:
    get:
      operationId: listNodes
      tags: [nodes]
      summary: Fleet membership (the local node + every registered worker)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [nodes, now]
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/Node" }
                  now: { type: string, example: "2026-11-10T09:00:00Z" }

  /v1/nodes/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    delete:
      operationId: deleteNode
      tags: [nodes]
      summary: Forget a worker (admin)
      description: >-
        Removes a worker from the fleet, e.g. a retired machine, or one that
        lost its state dir and now registers with a new API token (a node id
        stays bound to the token it first registered with). A worker that is
        still running registers again on its next heartbeat.
      responses:
        "204": { description: Removed }
        "400": { description: The control plane's own node cannot be removed }
        "404": { description: No such node }
        "409": { description: The control plane still routes sandboxes to this node }

  /v1/nodes/{id}/capacity:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      operationId: getNodeCapacity
      tags: [nodes]
      summary: One node's advertised capacity and current usage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeCapacity" }
        "404": { description: No such node }

  /v1/nodes/{id}/metrics:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      operationId: getNodeMetrics
      tags: [nodes]
      summary: Host telemetry of one node (CPU, memory, disk, network) and its recent history
      description: |
        Every fleet member (local node, `sandboxd worker`, executor) samples the
        machine it runs on from procfs/statfs and sends it with its heartbeat, so
        this works on a VPS, under Docker and in k3s alike. The history is kept in
        memory for one hour (one point per 5 s at most) and starts over when the
        control plane restarts.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  node: { $ref: "#/components/schemas/Node" }
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/NodeMetricPoint" }
                  step: { type: string }
                  window: { type: string }
                  now: { type: string, format: date-time }
        "404": { description: No such node }

  /v1/nodes/{id}/change-requests:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      operationId: listNodeChangeRequests
      tags: [nodes]
      summary: Recent capacity change pull requests for a node (head branch capacity/<id>-*)
      responses:
        "200":
          description: OK (an empty list when GitOps is not configured for the node)
          content:
            application/json:
              schema:
                type: object
                properties:
                  node_id: { type: string }
                  repo: { type: string }
                  base: { type: string }
                  file: { type: string, description: Values file mapped to the node; empty = not configured }
                  can_open_pr: { type: boolean }
                  current: { $ref: "#/components/schemas/ResourceAmount" }
                  error: { type: string }
                  requests:
                    type: array
                    items: { $ref: "#/components/schemas/NodeChangePR" }
    post:
      operationId: createNodeChangeRequest
      tags: [nodes]
      summary: Propose a new advertised capacity as a pull request on the deploy repo. Admin only.
      description: |
        Edits the `capacity:` block of the node's Helm values file
        (SANDBOXD_GITOPS_NODE_FILES) and opens a pull request. Nothing changes on
        the node until a human merges it and the deploy workflow runs helm upgrade;
        reverting the PR rolls it back. The request may not exceed what the host
        reports in its telemetry, nor the SANDBOXD_GITOPS_MAX_* ceilings.
        `dry_run: true` returns the preview without touching the repo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpus, memory_mb]
              properties:
                cpus: { type: number, description: "> 0, at most 2 decimals" }
                memory_mb: { type: integer, minimum: 256 }
                disk_mb: { type: integer, minimum: 0 }
                reason: { type: string, maxLength: 1000 }
                dry_run: { type: boolean }
      responses:
        "200": { description: Dry-run preview, content: { application/json: { schema: { $ref: "#/components/schemas/NodeChange" } } } }
        "201": { description: Pull request opened, content: { application/json: { schema: { $ref: "#/components/schemas/NodeChange" } } } }
        "400": { description: Invalid request, or more than the host has }
        "403": { description: Caller is not an admin }
        "404": { description: No such node }
        "409": { description: "gitops_not_configured (no mapping or no token) or no_change" }
        "502": { description: GitHub call failed }

  /v1/nodes/{id}/drain:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    post:
      operationId: drainNode
      tags: [nodes]
      summary: Drain a node. Admin only. New sandboxes are refused on a draining node; running ones stay.
      responses:
        "200":
          description: The node after the change
          content:
            application/json:
              schema:
                type: object
                properties:
                  node: { $ref: "#/components/schemas/Node" }
        "404": { description: No such node }
        "403": { description: Caller is not an admin }

  /v1/nodes/{id}/undrain:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    post:
      operationId: undrainNode
      tags: [nodes]
      summary: Return a drained node to the placement pool. Admin only.
      responses:
        "200":
          description: The node after the change
          content:
            application/json:
              schema:
                type: object
                properties:
                  node: { $ref: "#/components/schemas/Node" }
        "404": { description: No such node }
        "403": { description: Caller is not an admin }

  /v1/overview:
    get:
      operationId: getOverview
      tags: [observability]
      summary: Console overview — sandbox counts, open approvals, blocked egress (24h), recent sandboxes; user counts and audit tail for admins only
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sandboxes, ports_exposed, approvals_open, net_events_24h, recent, audit]
                properties:
                  sandboxes:
                    type: object
                    properties:
                      total: { type: integer }
                      running: { type: integer }
                      stopped: { type: integer }
                      creating: { type: integer }
                      error: { type: integer }
                  users:
                    nullable: true
                    description: null unless the caller is an admin
                    type: object
                    properties:
                      total: { type: integer }
                      admins: { type: integer }
                      operators: { type: integer }
                      viewers: { type: integer }
                      disabled: { type: integer }
                  ports_exposed: { type: integer }
                  approvals_open: { type: integer }
                  net_events_24h:
                    type: object
                    properties:
                      total: { type: integer }
                      blocked: { type: integer }
                  recent:
                    type: array
                    items: { $ref: "#/components/schemas/Sandbox" }
                  audit:
                    type: array
                    description: newest first; empty unless the caller is an admin
                    items:
                      type: object
                      properties:
                        at: { type: string, format: date-time }
                        actor: { type: string }
                        action: { type: string }
                        target: { type: string }
                        detail: { type: string }

  /v1/monitoring:
    get:
      operationId: getMonitoring
      tags: [observability]
      summary: Fleet resource view — one stats sample per running local sandbox plus the fleet CPU/memory history (10s steps, last 8 min, recorded while this endpoint is polled)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [fleet, sandboxes, history]
                properties:
                  fleet:
                    type: object
                    properties:
                      total: { type: integer }
                      running: { type: integer }
                      avg_cpu: { type: number }
                      mem_used_mb: { type: integer }
                      mem_limit_mb: { type: integer }
                  sandboxes:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        cpu_percent: { type: number }
                        mem_usage_bytes: { type: integer }
                        mem_limit_bytes: { type: integer }
                        pids: { type: integer }
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        t: { type: string, format: date-time }
                        cpu: { type: number }
                        mem_mb: { type: integer }

  /v1/capacity:
    get:
      operationId: getFleetCapacity
      tags: [nodes]
      summary: Fleet-wide capacity and usage totals plus the per-node breakdown
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [capacity, used, nodes, online, offline, draining, per_node, now]
                properties:
                  capacity: { $ref: "#/components/schemas/ResourceAmount" }
                  used:
                    allOf:
                      - $ref: "#/components/schemas/ResourceAmount"
                      - type: object
                        properties:
                          sandboxes: { type: integer }
                  nodes: { type: integer }
                  online: { type: integer }
                  offline: { type: integer }
                  draining: { type: integer }
                  per_node:
                    type: array
                    items: { $ref: "#/components/schemas/NodeCapacity" }
                  now: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string }
    ApprovalHeader:
      in: header
      name: X-Sandboxd-Approval
      required: false
      description: The id of an approved approval for exactly this request. Single use; bound to the request's hash.
      schema: { type: string }
  responses:
    ApprovalPending:
      description: The action needs an admin's approval. Repeat the same request with X-Sandboxd-Approval once approved.
      content:
        application/json:
          schema:
            type: object
            properties:
              approval_id: { type: string }
              status: { type: string, enum: [pending] }
              action: { type: string }
              target: { type: string }
              message: { type: string }
    PolicyDenied:
      description: The instance policy forbids this (code policy_denied or approval_required)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Ports:
      description: The sandbox's preview ports
      content:
        application/json:
          schema:
            type: object
            properties:
              ports:
                type: array
                items:
                  type: object
                  properties:
                    container: { type: integer }
                    preview_url: { type: string }
  schemas:
    Domain:
      type: object
      properties:
        domain: { type: string }
        tls_mode: { type: string, enum: [off, custom, letsencrypt] }
        acme_email: { type: string }
        running:
          type: object
          properties:
            domain: { type: string }
            tls_mode: { type: string }
        restart_required: { type: boolean }
        console_host: { type: string }
        preview_example: { type: string }
    Certificate:
      type: object
      properties:
        id: { type: string }
        subject: { type: string }
        dns_names: { type: array, items: { type: string } }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        default: { type: boolean }
    Role:
      type: string
      enum: [admin, operator, viewer]
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        created_at: { type: string }
        updated_at: { type: string }
    AuditEntry:
      type: object
      properties:
        id: { type: integer }
        at: { type: integer, description: unix seconds }
        actor_kind: { type: string }
        actor_name: { type: string }
        actor_ip: { type: string }
        action: { type: string }
        target: { type: string }
        detail: { type: string, description: JSON }
        prev_hash: { type: string }
        hash: { type: string, description: "sha256(prev_hash + canonical row)" }
    Policy:
      type: object
      properties:
        images:
          type: object
          properties:
            allowed: { type: array, items: { type: string }, description: empty = the instance image only }
        ports:
          type: object
          properties:
            ranges:
              type: array
              items: { type: object, properties: { min: { type: integer }, max: { type: integer } } }
        resources:
          type: object
          properties:
            max_cpus: { type: number }
            max_memory_mb: { type: integer }
            max_ports_per_sandbox: { type: integer }
        egress:
          type: object
          properties:
            mode: { type: string, enum: [strict, permissive], description: "strict: a sandbox may only allow hosts on this list" }
            allow: { type: array, items: { type: string } }
        lifecycle:
          type: object
          properties:
            allow_keep_alive: { type: boolean }
            max_idle_timeout_secs: { type: integer }
        approvals:
          type: array
          items: { type: string, enum: [sandbox.delete_keep_alive, policy.update, sandbox.egress_outside_policy, sandbox.public] }
          description: Actions that need an admin's approval first
    Lifecycle:
      type: object
      properties:
        idle_timeout_secs: { type: integer, description: 0 = instance default }
        keep_alive: { type: boolean }
    Egress:
      type: object
      properties:
        mode: { type: string, enum: [none, allowlist, open] }
        allow: { type: array, items: { type: string } }
        deny: { type: array, items: { type: string } }
        proxy: { type: string, description: The HTTP(S) proxy sandboxes reach the internet through; empty when egress enforcement is off }
    NetworkActivity:
      type: object
      properties:
        sandbox_id: { type: string }
        recording: { type: boolean, description: false when no egress proxy runs, so nothing is recorded }
        rules:
          type: object
          properties:
            mode: { type: string, enum: [none, allowlist, open] }
            allow: { type: array, items: { type: string } }
            deny: { type: array, items: { type: string } }
        cursor: { type: string }
        events:
          type: array
          items:
            type: object
            properties:
              seq: { type: integer }
              time: { type: string, format: date-time }
              method: { type: string }
              host: { type: string }
              port: { type: string }
              ip: { type: string }
              allowed: { type: boolean }
              reason: { type: string }
        hosts:
          type: array
          items:
            type: object
            properties:
              host: { type: string }
              ips: { type: array, items: { type: string } }
              ports: { type: array, items: { type: string } }
              allowed: { type: integer }
              denied: { type: integer }
              bytes_up: { type: integer }
              bytes_down: { type: integer }
              first_seen: { type: string, format: date-time }
              last_seen: { type: string, format: date-time }
              last_allowed: { type: boolean }
              last_reason: { type: string }
    Approval:
      type: object
      properties:
        id: { type: string }
        action: { type: string }
        target: { type: string }
        payload: { type: string }
        payload_hash: { type: string }
        status: { type: string, enum: [pending, approved, denied, used, expired] }
        requested_by: { type: string }
        decided_by: { type: string }
        reason: { type: string }
        created_at: { type: integer }
        decided_at: { type: integer }
        expires_at: { type: integer }
    PortRequest:
      type: object
      required: [container]
      additionalProperties: false
      properties:
        container: { type: integer, minimum: 1, maximum: 65535 }
    Resources:
      type: object
      description: Hard limits. Requests are clamped (not rejected) to the instance maximums; responses carry the applied values.
      properties:
        cpus: { type: number, description: "--cpus; 0 = no hard CPU limit" }
        memory_mb: { type: integer, description: "--memory; 0 in a request = instance default" }
    Metrics:
      type: object
      properties:
        sandbox_id: { type: string }
        status: { type: string }
        at: { type: string, format: date-time }
        stats:
          type: object
          properties:
            cpu_percent: { type: number }
            mem_usage_bytes: { type: integer, format: int64 }
            mem_limit_bytes: { type: integer, format: int64 }
            mem_percent: { type: number }
            net_rx_bytes: { type: integer, format: int64 }
            net_tx_bytes: { type: integer, format: int64 }
            block_read_bytes: { type: integer, format: int64 }
            block_write_bytes: { type: integer, format: int64 }
            pids: { type: integer }
    Sandbox:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [creating, running, stopped, error] }
        image: { type: string, description: "The image the sandbox runs (its own, or the instance image it follows)." }
        command: { type: array, items: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        resources: { $ref: "#/components/schemas/Resources" }
        egress: { type: array, items: { type: string }, description: "Allow list." }
        egress_mode: { type: string, enum: [none, allowlist, open] }
        egress_deny: { type: array, items: { type: string } }
        ports: { type: array, items: { type: integer } }
        preview: { $ref: "#/components/schemas/Preview" }
        visibility: { type: string, enum: [public, private] }
        idle_policy: { type: string, enum: [sleep, always_on] }
        external:
          type: object
          properties:
            user_id: { type: string }
            project_id: { type: string }
            workspace_id:
              type: string
              description: "Caller's tenant tag (PORTAL S3a). The Portal maps its org id here. Required on every create by keys minted with require_external."
        error_message: { type: string }
        last_active_at: { type: string, format: date-time }
        keepalive_until: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Preview:
      type: object
      description: Present only when the sandbox exposes ports.
      properties:
        url: { type: string }
        port: { type: integer, description: "Web port the preview URL routes to." }
        status: { type: string, enum: [running, down] }
    CreateSandboxRequest:
      type: object
      additionalProperties: false
      properties:
        image: { type: string, description: "Instance image when omitted. Any other image must be on SANDBOXD_IMAGE_ALLOWLIST." }
        command: { type: array, maxItems: 64, items: { type: string }, description: "Overrides the image CMD." }
        resources: { $ref: "#/components/schemas/Resources" }
        network:
          type: object
          additionalProperties: false
          properties:
            ports: { type: array, items: { $ref: "#/components/schemas/PortRequest" }, description: "Structured form of `ports`; use one or the other." }
            egress: { type: array, items: { type: string }, description: "Allow list (hosts, *.domains, IPs, CIDRs)." }
            egress_mode: { type: string, enum: [none, allowlist, open], default: allowlist, description: "open needs a permissive egress policy." }
            egress_deny: { type: array, items: { type: string }, description: "Always refused, in every mode." }
        ports: { type: array, items: { type: integer, minimum: 1, maximum: 65535 } }
        env: { type: object, additionalProperties: { type: string }, description: "Visible to every process in the sandbox. Never pass secrets." }
        visibility: { type: string, enum: [public, private], default: private }
        idle_policy: { type: string, enum: [sleep, always_on], default: sleep }
        external:
          type: object
          properties:
            user_id: { type: string }
            project_id: { type: string }
            workspace_id:
              type: string
              description: "Caller's tenant tag (PORTAL S3a). Required by keys minted with require_external — a create without it is 400 workspace_required."
        workspace:
          type: object
          description: Clone a public git repository into the workspace.
          required: [repo_url]
          properties:
            repo_url: { type: string }
            branch: { type: string }
    Settings:
      type: object
      description: Read-only instance summary (GET /v1/settings) and the shape returned by PATCH.
      properties:
        version: { type: string }
        git_commit: { type: string }
        networking:
          type: object
          properties:
            preview_domain: { type: string }
            public_http_port: { type: string }
            preview_base: { type: string, description: "scheme://<pattern>[:port] covering every preview host: *.preview.<domain> (nested) or s-*-*[--tag].<domain> (flat)." }
            preview_host_style: { type: string, enum: [nested, flat], description: "Hostname layout under preview_domain (PREVIEW_HOST_STYLE). nested: s-<id>-<port>.preview.<domain>; flat: s-<id>-<port>[--tag].<domain>." }
            preview_host_tag: { type: string, description: "Instance tag appended to flat-style hosts (PREVIEW_HOST_TAG); omitted when unset." }
            preview_tls: { type: boolean }
            preview_url_scheme: { type: string, description: "Effective scheme of generated preview URLs: http or https (PREVIEW_URL_SCHEME, else derived from preview_tls)." }
            preview_entrypoint: { type: string }
        auth:
          type: object
          properties:
            enabled: { type: boolean }
        runtime:
          type: object
          properties:
            storage_mode: { type: string }
            base_image: { type: string }
        lifecycle:
          type: object
          properties:
            idle_reap_enabled: { type: boolean }
            idle_threshold_seconds: { type: integer }
            keepalive_max_seconds: { type: integer }
        egress:
          type: object
          properties:
            mode: { type: string }
        capabilities:
          type: object
          additionalProperties: { type: boolean }
        editable:
          type: array
          items: { type: string }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
    Snapshot:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string }
        source_sandbox_id: { type: string }
        base_image: { type: string }
        visibility: { type: string }
        size_bytes: { type: integer }
        created_at: { type: string, format: date-time }
    Node:
      type: object
      required: [node_id, role, status, drain_state, capacity, used, sandboxes, registered_at, heartbeat_at]
      properties:
        node_id: { type: string, example: worker-1 }
        role: { type: string, enum: [local, worker] }
        status: { type: string, enum: [online, offline], description: Derived from the heartbeat lease; the local node is always online }
        drain_state: { type: string, enum: [active, drain] }
        address: { type: string }
        version: { type: string }
        capacity: { $ref: "#/components/schemas/ResourceAmount" }
        used:
          allOf:
            - $ref: "#/components/schemas/ResourceAmount"
            - type: object
              properties:
                sandboxes: { type: integer }
        sandboxes: { type: integer }
        registered_at: { type: string, format: date-time }
        heartbeat_at: { type: string, format: date-time }
        telemetry: { $ref: "#/components/schemas/HostTelemetry" }
        change_file: { type: string, description: Values file a capacity change request edits (absent = no GitOps mapping) }
    HostTelemetry:
      type: object
      description: Latest host sample a node sent with its heartbeat. Zero = not reported.
      properties:
        collected_at: { type: string, format: date-time }
        hostname: { type: string }
        os: { type: string }
        arch: { type: string }
        kernel: { type: string }
        uptime_sec: { type: integer }
        in_container: { type: boolean }
        cpu:
          type: object
          properties:
            cores: { type: integer }
            usage_percent: { type: number }
            load1: { type: number }
            load5: { type: number }
            load15: { type: number }
        memory:
          type: object
          properties:
            total_mb: { type: integer }
            used_mb: { type: integer }
            available_mb: { type: integer }
            swap_total_mb: { type: integer }
            swap_used_mb: { type: integer }
        disk:
          type: object
          properties:
            path: { type: string }
            total_mb: { type: integer }
            used_mb: { type: integer }
            free_mb: { type: integer }
        network:
          type: object
          properties:
            interfaces: { type: array, items: { type: string } }
            rx_bytes: { type: integer }
            tx_bytes: { type: integer }
            rx_bps: { type: number }
            tx_bps: { type: number }
            host_namespace: { type: boolean, description: false = counters of a container's own network namespace }
    NodeMetricPoint:
      type: object
      properties:
        t: { type: string, format: date-time }
        cpu_percent: { type: number }
        load1: { type: number }
        mem_used_mb: { type: integer }
        mem_total_mb: { type: integer }
        disk_used_mb: { type: integer }
        disk_total_mb: { type: integer }
        rx_bps: { type: number }
        tx_bps: { type: number }
    NodeChangePR:
      type: object
      properties:
        number: { type: integer }
        url: { type: string }
        title: { type: string }
        state: { type: string, enum: [open, closed, merged] }
        branch: { type: string }
        created_at: { type: string }
        merged_at: { type: string }
    NodeChange:
      type: object
      properties:
        node_id: { type: string }
        dry_run: { type: boolean }
        repo: { type: string }
        base: { type: string }
        file: { type: string }
        current: { $ref: "#/components/schemas/ResourceAmount" }
        proposed: { $ref: "#/components/schemas/ResourceAmount" }
        diff: { type: array, items: { type: string } }
        content: { type: string, description: The whole edited values file }
        can_open_pr: { type: boolean }
        pr: { $ref: "#/components/schemas/NodeChangePR" }
    NodeCapacity:
      type: object
      properties:
        node_id: { type: string }
        role: { type: string }
        status: { type: string }
        drain_state: { type: string }
        capacity: { $ref: "#/components/schemas/ResourceAmount" }
        used:
          allOf:
            - $ref: "#/components/schemas/ResourceAmount"
            - type: object
              properties:
                sandboxes: { type: integer }
        sandboxes: { type: integer }
    ResourceAmount:
      type: object
      properties:
        cpus: { type: number }
        memory_mb: { type: integer }
        disk_mb: { type: integer }
