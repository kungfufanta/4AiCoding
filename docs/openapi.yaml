openapi: 3.0.3
info:
  title: sandboxd /v1 API
  version: "0.3.0"
  description: >
    The public, tenant-scoped API for sandboxd. This is the only surface a
    console or external integration should use — the internal /sandbox and
    /wake endpoints are not part of this contract. Scoped by the API token
    (Bearer); when an operator explicitly disables auth, the whole
    surface is reachable without a token.
servers:
  - url: http://127.0.0.1:9090
    description: Default loopback bind (docker-compose maps SANDBOXD_API_BIND here)
security:
  - bearerAuth: []
  - {} # only when auth is explicitly disabled by the operator

tags:
  - name: apps
  - name: sandboxes
  - name: tasks
  - name: snapshots
  - name: agents

paths:
  /version:
    get:
      operationId: getVersion
      summary: Build version and commit (no auth; for monitoring and upgrade checks)
      security: []
      responses:
        "200":
          description: Build identity
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [version, commit]
                properties:
                  version: { type: string, example: v0.3.15 }
                  commit: { type: string, example: 1a2b3c4d5e6f }
  /v1/settings:
    get:
      operationId: getSettings
      tags: [apps]
      summary: Read-only instance/settings summary (safe metadata only; no secrets)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    patch:
      operationId: updateSettings
      tags: [apps]
      summary: Edit the runtime-editable settings (allowlisted)
      description: >
        Accepts ONLY the allowlisted editable fields: lifecycle tunables and
        agents.default_models. Any other key (auth, egress, networking, secrets,
        version, …) is rejected with 400. Persisted and hot-applied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lifecycle:
                  type: object
                  properties:
                    idle_reap_enabled: { type: boolean }
                    idle_threshold_seconds: { type: integer }
                    keepalive_max_seconds: { type: integer }
                agents:
                  type: object
                  properties:
                    default_models:
                      type: object
                      additionalProperties: { type: string }
                      description: >
                        Per-agent default model id (agent -> model). Merges into the
                        stored map; an empty value clears that agent's default. Only
                        runnable agents are accepted.
      responses:
        "200":
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/Error" }
        "503":
          description: Settings are not editable on this instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/status:
    get:
      operationId: authStatus
      tags: [apps]
      summary: Console auth status — is auth enabled, is the caller authenticated, is a password set (pre-login probe, no credential required)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  authenticated: { type: boolean }
                  password_set: { type: boolean }
  /v1/auth/setup:
    post:
      operationId: authSetup
      tags: [apps]
      summary: First-run — set the console password and start a session. 409 once a password is already set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, description: min 8 chars }
      responses:
        "204": { description: Password set; session cookie issued }
        "400": { description: Password too short / invalid body }
        "409": { description: A password is already set }
  /v1/auth/login:
    post:
      operationId: authLogin
      tags: [apps]
      summary: Verify the console password and issue an HttpOnly session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204": { description: Authenticated; session cookie issued }
        "401": { description: Invalid password }
  /v1/auth/logout:
    post:
      operationId: authLogout
      tags: [apps]
      summary: Revoke the current session and clear the cookie
      responses:
        "204": { description: Logged out }
  /v1/auth/password:
    post:
      operationId: authChangePassword
      tags: [apps]
      summary: Change the console password (requires a logged-in session); revokes all sessions and re-issues one
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, description: min 8 chars }
      responses:
        "204": { description: Password changed }
        "400": { description: New password too short / invalid body }
        "401": { description: Current password incorrect }
        "403": { description: Not logged in as a console user }
    delete:
      operationId: authResetPassword
      tags: [apps]
      summary: Reset (forget) the console password so the next visit creates a new one; revokes every session. API-key callers only — a console session is refused.
      responses:
        "204": { description: Password cleared and all sessions revoked }
        "401": { description: No credential }
        "403": { description: Caller is a console session, not an API key }
  /v1/api-keys:
    post:
      operationId: createApiKey
      tags: [apps]
      summary: Mint an API key (each = the shared tenant). The plaintext key is returned exactly once. Session-only.
      description: |
        `scopes` restricts what the key may call; omitted or empty = full access.
        A key with scope `upgrade` may only call `GET/POST /v1/upgrade`, `GET /healthz`,
        `GET /readyz`, `GET /version` and `GET /v1/auth/status` — every other route
        returns 403 `forbidden`. Intended for external updaters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: 1-64 printable chars }
                scopes:
                  type: array
                  items: { type: string, enum: [upgrade] }
                  description: Optional restriction; omitted = full access
      responses:
        "201":
          description: Created — plaintext key returned once
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  prefix: { type: string }
                  scopes: { type: array, items: { type: string } }
                  key: { type: string, description: plaintext — shown only here }
        "400": { description: Invalid name or unknown scope }
        "403": { description: Requires a console login }
        "409": { description: A key with that name already exists }
    get:
      operationId: listApiKeys
      tags: [apps]
      summary: List API keys (metadata only — never the key or its hash). Session-only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        prefix: { type: string }
                        created_at: { type: string }
                        last_used_at: { type: string }
                        scopes: { type: array, items: { type: string }, description: empty = full access }
        "403": { description: Requires a console login }
  /v1/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      tags: [apps]
      summary: Revoke an API key. Session-only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "403": { description: Requires a console login }
        "404": { description: No such key }

  /v1/sandboxes:
    post:
      operationId: createSandbox
      tags: [sandboxes]
      summary: Create a sandbox (programmatic; apps usually use /v1/apps/{id}/sandbox)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSandboxRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "400": { $ref: "#/components/responses/Error" }

  /v1/sandboxes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getSandbox
      tags: [sandboxes]
      summary: Get a sandbox (status + live preview state)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSandbox
      tags: [sandboxes]
      summary: Destroy the sandbox (container + workspace)
      responses:
        "200": { description: Destroyed }
        "404": { $ref: "#/components/responses/Error" }

  /v1/sandboxes/{id}/start:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    post:
      operationId: startSandbox
      tags: [sandboxes]
      summary: Start (wake) a stopped sandbox. Idempotent when running.
      responses:
        "200":
          description: Running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "409": { $ref: "#/components/responses/Error" }
        "503":
          description: Capacity pushback (Retry-After).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/sandboxes/{id}/stop:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    post:
      operationId: stopSandbox
      tags: [sandboxes]
      summary: Stop a running sandbox (frees RAM; wakes on start). Idempotent when stopped.
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "409":
          description: A task is in progress; cancel it first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/snapshots:
    get:
      operationId: listSnapshots
      tags: [snapshots]
      summary: List snapshots (tenant-scoped)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots:
                    type: array
                    items: { $ref: "#/components/schemas/Snapshot" }
    post:
      operationId: createSnapshot
      tags: [snapshots]
      summary: Capture a snapshot of a stopped sandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_sandbox_id, name]
              properties:
                source_sandbox_id: { type: string }
                name: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "409":
          description: Source sandbox is running; stop it first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/snapshots/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      operationId: getSnapshot
      tags: [snapshots]
      summary: Get a snapshot
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSnapshot
      tags: [snapshots]
      summary: Delete a snapshot
      responses:
        "204": { description: Deleted }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    AgentInstance:
      type: object
      properties:
        id: { type: string }
        package: { type: string }
        name: { type: string }
        connection_id: { type: string }
        model: { type: string }
        status: { type: string, enum: [running, stopped, missing] }
        telegram: { type: boolean }
        apps_today: { type: integer }
        apps_per_day: { type: integer }
        created_at: { type: string, format: date-time }
    ClaudeSignIn:
      type: object
      properties:
        logged_in: { type: boolean }
        method: { type: string, description: "How Claude Code is signed in (e.g. claude.ai), when logged_in." }
    ProviderModel:
      type: object
      required: [id]
      properties:
        id: { type: string, minLength: 1, maxLength: 200, description: Exact model ID or gateway alias, including any slashes }
        context_window: { type: integer, minimum: 512, maximum: 10000000, default: 32768 }
        max_tokens: { type: integer, minimum: 1, default: 4096, description: Must be smaller than context_window }
    ModelProviderInput:
      type: object
      required: [name, protocol, base_url, models]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        protocol: { type: string, enum: [openai-completions, anthropic-messages] }
        base_url: { type: string, format: uri, description: "HTTP(S) API base URL including its API prefix, e.g. http://ollama:11434/v1. Resolved from the control plane. No URL credentials, query or fragment." }
        models:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ProviderModel" }
        api_key: { type: string, writeOnly: true, description: "Optional. Omit to retain the saved key on update; empty string removes it. Stored encrypted on the control plane." }
    ModelProvider:
      type: object
      required: [id, name, protocol, base_url, models, has_api_key]
      properties:
        id: { type: string }
        name: { type: string }
        protocol: { type: string, enum: [openai-completions, anthropic-messages] }
        base_url: { type: string }
        models:
          type: array
          items: { $ref: "#/components/schemas/ProviderModel" }
        has_api_key: { type: boolean }
    Settings:
      type: object
      description: Read-only instance summary (GET /v1/settings) and the shape returned by PATCH.
      properties:
        version: { type: string }
        git_commit: { type: string }
        update_available: { type: boolean, description: "True when a newer release exists (best-effort, cached ~6h). Also true for builds with no comparable version (see update_kind)." }
        update_kind: { type: string, enum: [release, untagged], description: "Why an update is reported: release (an older tagged build) or untagged (dev / bare commit / describe-form build). Omitted when no update is reported." }
        latest_version: { type: string, description: "Latest release tag, once fetched." }
        changelog_url: { type: string, description: "Release page of latest_version." }
        latest_notes: { type: string, description: "Release notes of latest_version (markdown, capped at 16 KB)." }
        latest_breaking: { type: string, description: "The \"Breaking changes\" section of latest_notes (markdown); omitted when the release has none." }
        latest_published_at: { type: string, format: date-time }
        networking:
          type: object
          properties:
            preview_domain: { type: string }
            public_http_port: { type: string }
            preview_base: { type: string, description: "scheme://<pattern>[:port] covering every preview host: *.preview.<domain> (nested) or s-*-*[--tag].<domain> (flat)." }
            preview_host_style: { type: string, enum: [nested, flat], description: "Hostname layout under preview_domain (PREVIEW_HOST_STYLE). nested: s-<id>-<port>.preview.<domain>; flat: s-<id>-<port>[--tag].<domain>." }
            preview_host_tag: { type: string, description: "Instance tag appended to flat-style hosts (PREVIEW_HOST_TAG); omitted when unset." }
            preview_tls: { type: boolean }
            preview_url_scheme: { type: string, description: "Effective scheme of generated preview URLs: http or https (PREVIEW_URL_SCHEME, else derived from preview_tls)." }
            preview_entrypoint: { type: string }
        auth:
          type: object
          properties:
            enabled: { type: boolean }
        runtime:
          type: object
          properties:
            storage_mode: { type: string }
            base_image: { type: string }
        lifecycle:
          type: object
          properties:
            idle_reap_enabled: { type: boolean }
            idle_threshold_seconds: { type: integer }
            keepalive_max_seconds: { type: integer }
        egress:
          type: object
          properties:
            mode: { type: string }
        agents:
          type: object
          properties:
            providers: { type: array, items: { type: string } }
            system_prompt: { type: string, description: "Read-only platform system prompt appended to every agent run." }
            default_models:
              type: object
              additionalProperties: { type: string }
              description: "Per-agent default model id (agent -> model), used when a task doesn't specify one. Editable via PATCH agents.default_models."
        presets:
          type: array
          items: { $ref: "#/components/schemas/Preset" }
        capabilities:
          type: object
          additionalProperties: { type: boolean }
        editable:
          type: array
          items: { type: string }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
    App:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        external_user_id: { type: string }
        external_project_id: { type: string }
        runtime_preset: { type: string, description: "Default runtime preset id for new sandboxes." }
        current_sandbox_id: { type: string, description: "Empty when the app has no live sandbox." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Preset:
      type: object
      properties:
        id: { type: string, description: "e.g. react-vite, nextjs, node-express, fastapi, worker." }
        label: { type: string }
        description: { type: string }
        template: { type: string }
        capabilities: { type: array, items: { type: string }, description: "Image capabilities the preset needs." }
    CreateAppRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        external_user_id: { type: string }
        external_project_id: { type: string }
        runtime_preset: { type: string, description: "Runtime preset id; see GET /v1/presets." }
        git:
          type: object
          description: >-
            Import from an HTTPS repo. PUBLIC repos (curated starters or any public URL)
            clone tokenless — omit credential_id. PRIVATE repos reference a token by
            credential_id (from /v1/git-credentials), never inline; it is decrypted
            control-plane-side at clone time and never enters the sandbox.
          required: [repo_url]
          properties:
            repo_url: { type: string, description: "HTTPS repo URL, tokenless (no credentials in the URL)." }
            branch: { type: string, description: "Branch to clone (default main)." }
            credential_id: { type: string, description: "Owner-scoped git_credential id. Omit for a public tokenless clone." }
    PatchAppRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
    ConfigItem:
      type: object
      properties:
        key: { type: string }
        sensitive: { type: boolean }
        access_policy:
          type: string
          enum: [control_plane_only, agent_access, runtime_access, both]
        value_set: { type: boolean, description: "True when a value is stored." }
        value:
          type: string
          description: "Present only for non-sensitive entries; sensitive values are never returned."
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateConfigRequest:
      type: object
      required: [key]
      properties:
        key: { type: string }
        value: { type: string }
        sensitive: { type: boolean, default: false }
        access_policy:
          type: string
          enum: [control_plane_only, agent_access, runtime_access, both]
          default: control_plane_only
    PatchConfigRequest:
      type: object
      properties:
        value: { type: string, description: "Omit to keep the stored value unchanged." }
        sensitive: { type: boolean }
        access_policy:
          type: string
          enum: [control_plane_only, agent_access, runtime_access, both]
    Sandbox:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [creating, running, stopped, error] }
        template: { type: string }
        preview: { $ref: "#/components/schemas/Preview" }
        processes:
          type: array
          description: Supervised processes from the runtime manifest (web + workers).
          items: { $ref: "#/components/schemas/Process" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Process:
      type: object
      properties:
        name: { type: string }
        kind: { type: string, enum: [web, worker] }
        running: { type: boolean }
        pid: { type: integer }
        restarts: { type: integer }
    ManifestEffective:
      type: object
      description: The manifest as runtimed would see it after core defaults (port 3000, health_path /).
      properties:
        web:
          type: object
          properties:
            command: { type: string }
            port: { type: integer }
            health_path: { type: string }
        workers:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              command: { type: string }
    ManifestValidation:
      type: object
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        parsed:
          allOf: [{ $ref: "#/components/schemas/ManifestEffective" }]
          description: The manifest as-declared (no defaults) — present whenever the YAML parsed, even if invalid, so callers can confirm the web block was understood.
        effective:
          allOf: [{ $ref: "#/components/schemas/ManifestEffective" }]
          description: Present ONLY when valid is true; omitted for an invalid manifest.
    Preview:
      type: object
      properties:
        url: { type: string, description: "Preview URL; the hostname port is the resolved web port (manifest/preset/3000)." }
        port: { type: integer, description: "Resolved web port the preview routes to (A1.5a)." }
        status: { type: string, enum: [starting, up, down, error] }
        last_checked_at: { type: string, format: date-time }
    CreateSandboxRequest:
      type: object
      properties:
        template: { type: string }
        from_snapshot: { type: string }
        runtime_preset: { type: string, description: "Runtime preset id; see GET /v1/presets." }
        visibility: { type: string, enum: [public, private] }
        project:
          type: object
          properties:
            id: { type: string }
            user_id: { type: string }
    SubmitTaskRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }
        agent: { type: string, enum: [opencode, pi, claude-code, codex], default: opencode }
        provider: { type: string, description: "Configured model connection ID, supported by OpenCode and Pi. Required for Pi. With a connection, model is an exact configured ID; omitted selects its first model." }
        continue: { type: boolean, default: true, description: Resume this agent session when available }
        model:
          type: string
          description: >
            With provider set, an exact configured model ID (no extra agent prefix).
            Otherwise, optional per-task model, passed to the agent CLI's --model. Agent-namespaced:
            opencode wants "provider/model" (e.g. opencode/claude-sonnet-4-5), claude an
            alias/id (e.g. sonnet). Empty = the agent's default. Max 200 chars; validity
            is the agent's concern (an unknown model fails the task).
        timeout_s: { type: integer, description: "0/omitted = 10m default; max 86400." }
    RunSettings:
      type: object
      description: >
        Present when the task changed sandbox.yaml (how the app starts). runtimed
        applies a valid change live (applied), defers worker-only changes to the
        next start (next_start), or puts the previous file back when the change
        would break the preview (kept_previous: invalid file, removed file,
        another web port, or switching between a web app and a worker-only app).
        message is plain language for the end user.
      required: [status, message]
      properties:
        status: { type: string, enum: [applied, next_start, kept_previous] }
        message: { type: string }
        web_command: { type: string }
        preview_ready: { type: boolean, description: whether the app answered on its health path after the new settings were applied }
    TaskResult:
      type: object
      properties:
        id: { type: string }
        sandbox_id: { type: string }
        status: { type: string, enum: [running, succeeded, failed, cancelled] }
        failure_reason: { type: string }
        error_message: { type: string }
        files_changed: { type: array, items: { type: string } }
        build_ok: { type: boolean, description: "Backward-compat; true only when build_status=passed." }
        build_status: { type: string, enum: [passed, failed, skipped] }
        build_error_message: { type: string }
        preview_status_after: { type: string }
        run_settings: { $ref: '#/components/schemas/RunSettings' }
        preview_ok: { type: boolean, description: "Web apps only; omitted for worker-only." }
        app_healthy: { type: boolean }
        duration_ms: { type: integer }
    Event:
      type: object
      description: One entry in the durable activity timeline.
      properties:
        id: { type: string, description: "ULID; also the pagination cursor." }
        type: { type: string, description: "Stable machine-readable, e.g. task.failed, snapshot.restored." }
        severity: { type: string, enum: [info, warning, error] }
        message: { type: string, description: "Human-readable; not for programmatic logic." }
        app_id: { type: string }
        sandbox_id: { type: string }
        task_id: { type: string }
        snapshot_id: { type: string }
        payload: { type: object, additionalProperties: true, description: "Small JSON; no secrets or large logs." }
        created_at: { type: string, format: date-time }
    Snapshot:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string }
        source_sandbox_id: { type: string }
        source_app_id: { type: string, description: "App the snapshot was captured from." }
        base_image: { type: string }
        visibility: { type: string }
        size_bytes: { type: integer }
        created_at: { type: string, format: date-time }
