version: 2
# Paused: open-pull-requests-limit 0 stops all version-update PRs. Set a
# limit above 0 on an entry to turn its updates back on.
updates:
  # Go modules — one grouped PR/week for minor+patch; majors come separately.
  - package-ecosystem: gomod
    directory: /control-plane
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      go:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions — group everything (action major bumps are low-risk).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]

  # Docker base images — group minor+patch.
  - package-ecosystem: docker
    directories:
      - /control-plane
      - /image
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
