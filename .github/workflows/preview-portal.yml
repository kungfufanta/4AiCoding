name: preview-portal

# PR preview for the Portal (PORTAL_PLAN_V2 P1/P4): build the compose
# stack (postgres + portal + a dev sandboxd), drive the dashboard in a
# real browser (login, projects, invite, audit, dark mode, mobile, and
# from P4 the full sandbox flow: create → running → exec → delete) and
# attach a screenshot of every screen to the run.
on:
  pull_request:
    paths:
      - "portal/**"
      - "docker-compose.portal.yml"
      - ".github/workflows/preview-portal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Since P0 there is no default admin password; the preview stack
      # gets a fixed one just for the browser run (>= 12 chars).
      PORTAL_ADMIN_USERNAME: admin
      PORTAL_ADMIN_PASSWORD: preview-admin-password
      PORTAL_ADMIN_EMAIL: admin@portal.local
      # P4 sandbox backend (profile `sandboxes`, dev auth disabled).
      PORTAL_SANDBOXD_URL: http://sandboxd:9191
      # The webhook secret must match sandboxd's SANDBOXD_WEBHOOK_SECRET
      # (compose default below) — signed lifecycle events keep the index
      # fresh while the browser test runs.
      PORTAL_SANDBOXD_WEBHOOK_SECRET: dev-webhook-secret
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install browser test deps
        working-directory: portal/e2e
        # --with-deps apt-installs browser libraries; the runner's DNS
        # occasionally fails mid-apt (2026-11-11: 52 resolve failures in
        # one run), so retry the whole install once before failing.
        run: |
          ok=""
          for i in 1 2; do
            if npm install --no-audit --no-fund && npx playwright install --with-deps chromium; then
              ok=1; break
            fi
            [ "$i" = 1 ] && echo "install failed — retrying once" && sleep 10
          done
          [ -n "$ok" ] || { echo "browser deps install failed twice"; exit 1; }
          npx playwright --version

      - name: sandbox backend up (build sandboxd + e2e base images)
        run: docker compose -f docker-compose.portal.yml --profile sandboxes up -d --build sandboxd sandbox-image sandbox-agent-image

      - name: fake LLM up (A3.4 agent scenario)
        run: docker compose -f docker-compose.portal.yml --profile e2e up -d fake-llm

      - name: wait for fake-llm health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9933/healthz && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:9933/healthz

      - name: wait for sandboxd health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9191/healthz && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:9191/healthz

      - name: compose stack up (postgres + portal)
        run: docker compose -f docker-compose.portal.yml --profile sandboxes up -d --build postgres portal

      - name: wait for portal health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 2
          done
          curl -fsS http://localhost:8080/healthz

      - name: run portal browser tests
        working-directory: portal/e2e
        env:
          BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: compose logs (diagnose failures)
        if: failure()
        run: |
          docker compose -f docker-compose.portal.yml --profile sandboxes --profile e2e logs portal sandboxd fake-llm --tail 200

      - name: screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-preview-${{ github.event.pull_request.number || github.run_id }}
          path: portal/e2e/test-results/preview/
          if-no-files-found: ignore
          retention-days: 14
