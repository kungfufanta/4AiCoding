name: deploy-control-plane

on:
  push:
    branches: [main]
    paths:
      - "control-plane/**"
      - "console/**"
      - "traefik/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-control-plane.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-4aicoding-control-plane
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy PVE1 control plane
    runs-on: ubuntu-latest
    environment: pve1-4aicoding
    steps:
      - uses: actions/checkout@v7
      - name: Configure deployment SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.PVE1_4AICODING_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PVE1_4AICODING_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload exact source revision
        run: |
          set -eu
          archive="$RUNNER_TEMP/4aicoding-${GITHUB_SHA}.tar.gz"
          git archive --format=tar.gz "$GITHUB_SHA" > "$archive"
          scp -o BatchMode=yes "$archive" \
            dhadmin@192.168.1.188:"/tmp/4aicoding-${GITHUB_SHA}.tar.gz"
      - name: Rebuild, health-check, and prune obsolete stack containers
        run: |
          set -eu
          ssh -o BatchMode=yes dhadmin@192.168.1.188 \
            "SHA='${GITHUB_SHA}' bash -s" <<'REMOTE'
          set -euo pipefail
          archive="/tmp/4aicoding-${SHA}.tar.gz"
          test -f "$archive"
          sudo tar -xzf "$archive" -C /opt/4aicoding
          rm -f "$archive"
          cd /opt/4aicoding
          sudo docker compose up -d --build --remove-orphans
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9090/healthz >/dev/null; then
              echo "control-plane healthy at ${SHA}"
              exit 0
            fi
            sleep 2
          done
          echo "control-plane health check failed" >&2
          sudo docker compose ps >&2 || true
          sudo docker compose logs --tail=100 sandboxd >&2 || true
          exit 1
          REMOTE
