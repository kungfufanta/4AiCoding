name: a35-acceptance
# A3.5 production acceptance (plan §11 A3.5 "Xong khi") — run BY HAND:
#
#   1. Put the A3.5 image on production first: dispatch
#      deploy-k3s-portal.yml with the branch ref (push-to-main deploys
#      only after the merge).
#   2. Dispatch this workflow. It checks the portal pod's agent wiring
#      through kubectl exec (env NAMES only — no secret values are
#      printed), logs in with the bootstrap admin, hands the task to
#      the agent through the BFF (real WebHub connection via the
#      deployment's default LLM, real sandboxd sandbox), and captures
#      the evidence as artifacts: run JSON, exec output of
#      workspace/index.html, screenshots of the run card.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    environment: k3s-1
    steps:
      - uses: actions/checkout@v7

      - name: Check the portal pod's agent wiring (env names only)
        env:
          KUBECONFIG_B64: ${{ secrets.K3S_4AICODING_KUBECONFIG_B64 }}
        run: |
          set -eu
          test -n "$KUBECONFIG_B64" || { echo "::error::kubeconfig secret missing"; exit 1; }
          echo "$KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          POD=$(kubectl -n 4aicoding get pods -l app.kubernetes.io/name=portal -o jsonpath='{.items[0].metadata.name}')
          test -n "$POD" || { echo "::error::no portal pod in 4aicoding"; exit 1; }
          echo "portal pod: $POD"
          kubectl -n 4aicoding exec "$POD" -- sh -c \
            'for v in PORTAL_SANDBOXD_URL PORTAL_AGENT_WORKERS PORTAL_DEFAULT_LLM_API_KEY PORTAL_DEFAULT_LLM_BASE_URL PORTAL_DEFAULT_LLM_MODEL; do if [ -n "${!v:-}" ]; then echo "$v: set"; else echo "$v: MISSING"; fi; done'
          kubectl -n 4aicoding exec "$POD" -- sh -c 'test -n "${PORTAL_SANDBOXD_URL:-}"' || {
            echo "::error::PORTAL_SANDBOXD_URL is not set on the portal pod — wire sandboxd.url (+ apiKey/webhookSecret) in deploy/k3s-1-portal-values.yaml and redeploy before running the acceptance; without sandboxd every run fails sandbox_unavailable by design."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Acceptance flow (login → sandbox → agent run → evidence)
        env:
          BASE_URL: https://chat.devhub.io.vn
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ${{ secrets.PORTAL_ADMIN_PASSWORD }}
          ACCEPT_OUT: ${{ runner.temp }}/a35
        run: |
          set -eu
          test -n "$ADMIN_PASSWORD" || { echo "::error::PORTAL_ADMIN_PASSWORD secret is empty — password login is disabled on the deployment"; exit 1; }
          bash scripts/a35-acceptance.sh
          cat "$ACCEPT_OUT/ids.json"
          cat "$ACCEPT_OUT/run-summary.json"

      - name: Screenshots of the finished run
        env:
          ACCEPT_OUT: ${{ runner.temp }}/a35
        run: |
          set -eu
          cd portal/e2e
          npm ci --no-audit --no-fund
          npx playwright install chromium --with-deps
          node ../../scripts/a35-shot.mjs "$ACCEPT_OUT/ids.json" "$ACCEPT_OUT/cookies.txt" "$ACCEPT_OUT/shot"

      - name: Upload the evidence
        uses: actions/upload-artifact@v4
        with:
          name: a35-acceptance
          path: |
            ${{ runner.temp }}/a35/ids.json
            ${{ runner.temp }}/a35/run-final.json
            ${{ runner.temp }}/a35/run-summary.json
            ${{ runner.temp }}/a35/exec-index.html.json
            ${{ runner.temp }}/a35/shot-chat.png
            ${{ runner.temp }}/a35/shot-chat-dark.png
          if-no-files-found: error
          retention-days: 14
