# Deploys the Portal (docs/PORTAL_PLAN.md) to the k3s-1 cluster, exposed
# publicly at https://chat.devhub.io.vn through the k3s Traefik edge
# (cert-manager issues the Let's Encrypt certificate). Mirror of
# deploy-k3s-1.yml, which deploys the hardened worker with the same
# kubeconfig secret.
#
# One-time setup — GitHub → Settings → Environments → k3s-1:
#   K3S_4AICODING_KUBECONFIG_B64   scoped kubeconfig (already used by
#                                  deploy-k3s-1.yml)
#   PORTAL_DATABASE_URL            portal DSN, e.g.
#                                  postgres://portal:<pw>@stag.postgres.devhub.io.vn:5432/portal
#   PORTAL_ADMIN_PASSWORD          optional, min 12 chars: enables the
#                                  bootstrap password login as "admin".
#                                  Unset = password login off (SSO only).
#   PORTAL_OIDC_ISSUER             optional (S1 login); the login route
#   PORTAL_OIDC_CLIENT_ID          stays disabled unless all three are set
#   PORTAL_OIDC_CLIENT_SECRET
#   PORTAL_DEFAULT_LLM_API_KEY     optional: WebHub wh_ key for the Chat
#                                  page (glm-4.6). Unset = chat shows
#                                  "not configured".
#   PORTAL_SECRETS_KEY             optional: master key for stored LLM
#                                  keys (A2). Leave it unset and the first
#                                  deploy generates one and keeps it in the
#                                  cluster Secret portal-secrets-key.
#   PORTAL_SECRETS_ADMIN_TOKEN     optional: fine-grained PAT on this repo
#                                  with "Secrets" + "Environments" read &
#                                  write. When set, a generated key is also
#                                  saved back as the PORTAL_SECRETS_KEY
#                                  secret of this environment (backup).
#
# DNS: chat.devhub.io.vn must point at the k3s-1 edge (same target as
# 4aicoding.devhub.io.vn) so Traefik routes the host and cert-manager can
# complete the challenge for the chat-devhub-io-vn-tls secret.

name: deploy-k3s-portal

on:
  push:
    branches: [main]
    paths:
      - "portal/**"
      - "deploy/**"
      - "!deploy/rbac/**"
      - ".github/workflows/deploy-k3s-portal.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-k3s-portal
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kungfufanta/4aicoding-portal
  NAMESPACE: 4aicoding
  RELEASE: 4aicoding-portal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: portal
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: k3s-1
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Configure scoped kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.K3S_4AICODING_KUBECONFIG_B64 }}
        run: |
          set -eu
          test -n "$KUBECONFIG_B64"
          echo "$KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.PORTAL_DATABASE_URL }}
        run: |
          set -eu
          if [ -z "$DATABASE_URL" ]; then
            echo "PORTAL_DATABASE_URL is not set on the k3s-1 environment." >&2
            echo "Add it under Settings → Environments → k3s-1, e.g." >&2
            echo "  postgres://portal:<password>@stag.postgres.devhub.io.vn:5432/portal" >&2
            echo "The portal applies its own migrations at boot and creates the" >&2
            echo "portal_app RLS role (migration 0002_tenants_rls.sql), so the DSN" >&2
            echo "user needs CREATE ROLE privilege on first boot." >&2
            exit 1
          fi
      - name: Apply database secret
        env:
          DATABASE_URL: ${{ secrets.PORTAL_DATABASE_URL }}
          ADMIN_PASSWORD: ${{ secrets.PORTAL_ADMIN_PASSWORD }}
          LLM_API_KEY: ${{ secrets.PORTAL_DEFAULT_LLM_API_KEY }}
        run: |
          set -eu
          # The namespace already exists (the deployer ServiceAccount lives
          # in it) and that account has no cluster-scoped rights, so the
          # workflow must not try to create or read Namespace objects.
          # Rotated on every deploy so a DSN change takes effect here,
          # not by hand-editing a Secret in the cluster.
          # admin-password is written only when PORTAL_ADMIN_PASSWORD is
          # set; without it the portal turns the password login off and
          # removes any stored password login at boot.
          d="$RUNNER_TEMP/portal-secret"
          mkdir -m 700 -p "$d"
          printf '%s' "$DATABASE_URL" > "$d/database-url"
          args=(--from-file=database-url="$d/database-url")
          if [ -n "$ADMIN_PASSWORD" ]; then
            printf '%s' "$ADMIN_PASSWORD" > "$d/admin-password"
            args+=(--from-file=admin-password="$d/admin-password")
            echo "bootstrap password login: enabled"
          else
            echo "bootstrap password login: disabled (PORTAL_ADMIN_PASSWORD not set)"
          fi
          if [ -n "$LLM_API_KEY" ]; then
            printf '%s' "$LLM_API_KEY" > "$d/llm-api-key"
            args+=(--from-file=llm-api-key="$d/llm-api-key")
            echo "chat: enabled"
          else
            echo "chat: disabled (PORTAL_DEFAULT_LLM_API_KEY not set)"
          fi
          kubectl -n "$NAMESPACE" create secret generic portal-database "${args[@]}" \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -rf "$d"
      - name: Ensure secrets master key (never rotated)
        # PORTAL_SECRETS_KEY encrypts every stored LLM API key, so it must
        # stay the same across deploys. Order of precedence:
        #   1. the cluster Secret portal-secrets-key, once it exists, is
        #      the source of truth and is never overwritten;
        #   2. otherwise the PORTAL_SECRETS_KEY environment secret seeds it;
        #   3. otherwise a fresh random 32-byte key is generated.
        # A generated key is copied back to the GitHub environment secret
        # when PORTAL_SECRETS_ADMIN_TOKEN is set (GITHUB_TOKEN cannot write
        # secrets). The key is masked and never echoed.
        env:
          GH_SECRETS_KEY: ${{ secrets.PORTAL_SECRETS_KEY }}
          ADMIN_TOKEN: ${{ secrets.PORTAL_SECRETS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          name=portal-secrets-key
          d="$RUNNER_TEMP/portal-secrets-key"
          mkdir -m 700 -p "$d"
          trap 'rm -rf "$d"' EXIT
          generated=false
          if kubectl -n "$NAMESPACE" get secret "$name" >/dev/null 2>&1; then
            kubectl -n "$NAMESPACE" get secret "$name" -o jsonpath='{.data.secrets-key}' \
              | base64 --decode > "$d/key"
            test -s "$d/key"
            echo "::add-mask::$(cat "$d/key")"
            if [ -n "$GH_SECRETS_KEY" ] && [ "$GH_SECRETS_KEY" != "$(cat "$d/key")" ]; then
              echo "::error::PORTAL_SECRETS_KEY on k3s-1 differs from the cluster Secret $name." >&2
              echo "Refusing to rotate: stored LLM keys would become unreadable." >&2
              echo "Remove or fix the GitHub secret (the cluster copy is kept)." >&2
              exit 1
            fi
            echo "secrets key: kept existing cluster Secret $name"
          else
            if [ -n "$GH_SECRETS_KEY" ]; then
              printf '%s' "$GH_SECRETS_KEY" > "$d/key"
              echo "secrets key: seeded from the PORTAL_SECRETS_KEY environment secret"
            else
              openssl rand -base64 32 | tr -d '\n' > "$d/key"
              echo "::add-mask::$(cat "$d/key")"
              generated=true
              echo "secrets key: generated a new random key"
            fi
            # create (not apply): fails instead of overwriting if another
            # run created it in the meantime.
            kubectl -n "$NAMESPACE" create secret generic "$name" \
              --from-file=secrets-key="$d/key"
          fi
          if [ -z "$GH_SECRETS_KEY" ]; then
            if [ -n "$ADMIN_TOKEN" ]; then
              GH_TOKEN="$ADMIN_TOKEN" gh secret set PORTAL_SECRETS_KEY \
                --repo "$GITHUB_REPOSITORY" --env k3s-1 < "$d/key"
              echo "secrets key: saved to the k3s-1 environment secret PORTAL_SECRETS_KEY"
            else
              echo "::notice::PORTAL_SECRETS_KEY lives only in the cluster Secret $name. Set PORTAL_SECRETS_ADMIN_TOKEN to back it up to GitHub automatically."
            fi
          fi
          if [ "$generated" = true ]; then
            echo "secrets key: new key in use from this deploy on"
          fi
      - name: Deploy portal (chat.devhub.io.vn)
        env:
          OIDC_ISSUER: ${{ secrets.PORTAL_OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ secrets.PORTAL_OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.PORTAL_OIDC_CLIENT_SECRET }}
        run: |
          set -eu
          oidc_args=()
          if [ -n "$OIDC_ISSUER" ] && [ -n "$OIDC_CLIENT_ID" ] && [ -n "$OIDC_CLIENT_SECRET" ]; then
            # Helm --set/--set-string mangle commas and special characters,
            # so write the OIDC values to a file instead. jq -Rs produces a
            # JSON string, which is valid YAML and escapes everything.
            oidc_file="$RUNNER_TEMP/portal-oidc-values.yaml"
            {
              echo "oidc:"
              echo "  issuer: $(printf '%s' "$OIDC_ISSUER" | jq -Rs .)"
              echo "  clientID: $(printf '%s' "$OIDC_CLIENT_ID" | jq -Rs .)"
              echo "  clientSecret: $(printf '%s' "$OIDC_CLIENT_SECRET" | jq -Rs .)"
            } > "$oidc_file"
            oidc_args=(--values "$oidc_file")
            echo "OIDC login enabled (issuer: $OIDC_ISSUER)"
          else
            echo "PORTAL_OIDC_* not fully set on k3s-1 — deploying with the login route disabled"
          fi
          helm upgrade --install "$RELEASE" deploy/helm/portal \
            --namespace "$NAMESPACE" \
            --values deploy/k3s-1-portal-values.yaml \
            --set image.repository="$IMAGE" \
            --set image.tag="${{ github.sha }}" \
            "${oidc_args[@]}" \
            --wait --timeout 5m
      - name: Verify applied pod hardening
        run: |
          set -eu
          pod="$(kubectl -n "$NAMESPACE" get pods -l app.kubernetes.io/name=portal,app.kubernetes.io/instance="$RELEASE" -o jsonpath='{.items[0].metadata.name}')"
          test -n "$pod"
          kubectl -n "$NAMESPACE" get pod "$pod" -o jsonpath='{.spec.automountServiceAccountToken}' | grep -qx false
          kubectl -n "$NAMESPACE" get pod "$pod" -o jsonpath='{.spec.containers[0].securityContext.readOnlyRootFilesystem}' | grep -qx true
          kubectl -n "$NAMESPACE" get pod "$pod" -o jsonpath='{.spec.containers[0].securityContext.allowPrivilegeEscalation}' | grep -qx false
          kubectl -n "$NAMESPACE" get pod "$pod" -o jsonpath='{.spec.containers[0].securityContext.capabilities.drop[0]}' | grep -qx ALL
      - name: Verify public route (chat.devhub.io.vn)
        run: |
          set -eu
          hosts="$(kubectl -n "$NAMESPACE" get ingress "$RELEASE" -o jsonpath='{.spec.rules[*].host}')"
          echo "Ingress hosts: $hosts"
          echo "$hosts" | grep -qw chat.devhub.io.vn
          tls="$(kubectl -n "$NAMESPACE" get ingress "$RELEASE" -o jsonpath='{.spec.tls[0].secretName}')"
          test "$tls" = "chat-devhub-io-vn-tls"
      - name: Smoke test in-cluster health
        # The namespace enforces PodSecurity "restricted", so the curl pod
        # needs explicit security contexts (same overrides as
        # deploy-k3s-zitadel.yml) or admission rejects it with Forbidden.
        run: |
          set -eu
          for attempt in $(seq 1 10); do
            if kubectl -n "$NAMESPACE" run "portal-smoke-${GITHUB_SHA:0:12}" --rm -i --restart=Never \
              --image=curlimages/curl:8.10.1 \
              --overrides='{"spec":{"securityContext":{"runAsNonRoot":true,"runAsUser":100,"seccompProfile":{"type":"RuntimeDefault"}},"containers":[{"name":"portal-smoke-'"${GITHUB_SHA:0:12}"'","image":"curlimages/curl:8.10.1","command":["curl","-fsS","--max-time","5","http://'"$RELEASE"'/healthz"],"securityContext":{"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]}}}]}}'; then
              echo "portal healthy through the Service"
              exit 0
            fi
            echo "attempt $attempt failed; retrying"
            sleep 3
          done
          echo "portal /healthz did not answer through the Service" >&2
          kubectl -n "$NAMESPACE" logs deploy/"$RELEASE" --tail=50 >&2 || true
          exit 1
      - name: Diagnose a failed rollout
        # Without this a failed `helm --wait` only says "context deadline
        # exceeded": show why the pod never became Ready (image pull,
        # crash loop, failed migration, probe failures).
        if: failure()
        run: |
          set +e
          sel="app.kubernetes.io/name=portal,app.kubernetes.io/instance=$RELEASE"
          kubectl -n "$NAMESPACE" get deploy,rs,pods -l "$sel" -o wide
          for pod in $(kubectl -n "$NAMESPACE" get pods -l "$sel" -o jsonpath='{.items[*].metadata.name}'); do
            echo "::group::describe $pod"
            kubectl -n "$NAMESPACE" describe pod "$pod" | sed -n '/^Containers:/,$p'
            echo "::endgroup::"
            echo "::group::logs $pod"
            kubectl -n "$NAMESPACE" logs "$pod" --tail=100 --all-containers
            kubectl -n "$NAMESPACE" logs "$pod" --tail=100 --all-containers --previous 2>/dev/null
            echo "::endgroup::"
          done
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -30
      - name: Report certificate status
        # Informational: certificate issuance needs chat.devhub.io.vn DNS
        # to point at the edge first; a pending cert must not fail an
        # otherwise-good deploy.
        run: |
          kubectl -n "$NAMESPACE" get certificate chat-devhub-io-vn-tls \
            -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}{"\n"}' \
            || echo "certificate chat-devhub-io-vn-tls not created yet (ingress-shim waits for the DNS)"
