name: ci

on:
  push:
    branches: [main, minimal, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit tests: fast, no Docker daemon needed.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -race -count=1 ./...

  # Console: typecheck + production build of the React SPA.
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install
        run: corepack enable && pnpm install --frozen-lockfile

      - name: build
        run: pnpm build

  # Portal (PORTAL_PLAN S0): Go unit + migration tests against a real
  # Postgres 16 service, plus lint/template of the chart.
  portal-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal -d portal_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PORTAL_TEST_DATABASE_URL: postgres://portal:portal@127.0.0.1:5432/portal_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: portal/go.mod
          cache-dependency-path: portal/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -race -count=1 ./...

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: helm lint + template (deploy/helm/portal)
        run: |
          cd ..
          helm lint deploy/helm/portal --set database.url=postgres://portal:portal@localhost:5432/portal
          helm template portal deploy/helm/portal --set database.url=postgres://portal:portal@localhost:5432/portal > /dev/null
          helm template portal deploy/helm/portal --set database.existingSecret=portal-db --set ingress.enabled=true > /dev/null

  # Portal web (PORTAL_PLAN S0): typecheck + production build of the SPA.
  portal-console:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portal/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install
        run: corepack enable && pnpm install --frozen-lockfile

      - name: build
        run: pnpm build

  # Integration: run the real sandboxd binary against the runner's Docker
  # daemon and drive the sandbox lifecycle over HTTP (scripts/e2e.sh).
  integration:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum

      - name: build sandboxd
        run: cd control-plane && go build -o "$RUNNER_TEMP/sandboxd" ./cmd/sandboxd

      - name: build e2e sandbox image
        run: docker build -t sandboxd-e2e:ci scripts/e2e

      - name: lifecycle e2e
        env:
          SANDBOXD_IMAGE: sandboxd-e2e:ci
          SANDBOXD_BIN: ${{ runner.temp }}/sandboxd
        # sandboxd runs as root in production (it must delete workspace files
        # written by the sandbox user, uid 1000). As the runner user, DELETE
        # fails with "remove workspace: permission denied".
        run: sudo --preserve-env=SANDBOXD_IMAGE,SANDBOXD_BIN bash scripts/e2e.sh

      - name: auth e2e (login, roles, keys, keep-alive, approvals, audit)
        env:
          SANDBOXD_IMAGE: sandboxd-e2e:ci
          SANDBOXD_BIN: ${{ runner.temp }}/sandboxd
        run: sudo --preserve-env=SANDBOXD_IMAGE,SANDBOXD_BIN bash scripts/e2e-auth.sh

      - name: fleet e2e (2 workers register, drain, offline)
        env:
          SANDBOXD_IMAGE: sandboxd-e2e:ci
          SANDBOXD_BIN: ${{ runner.temp }}/sandboxd
        run: sudo --preserve-env=SANDBOXD_IMAGE,SANDBOXD_BIN bash scripts/e2e-fleet.sh

      - name: fleet exec e2e (sandboxes run on an executor worker)
        env:
          SANDBOXD_IMAGE: sandboxd-e2e:ci
          SANDBOXD_BIN: ${{ runner.temp }}/sandboxd
        run: sudo --preserve-env=SANDBOXD_IMAGE,SANDBOXD_BIN bash scripts/e2e-fleet-exec.sh

      - name: leftover containers
        if: always()
        run: docker ps -a --filter "label=sandboxd.managed=true"

  # k3s (PLAN M7a): the Helm chart runs `sandboxd worker` on a real k3s
  # cluster and the pod joins the control plane's fleet (scripts/e2e-k3s.sh).
  k3s:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      K3S_VERSION: v1.31.4+k3s1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: helm lint
        run: |
          helm lint deploy/helm/sandboxd-worker --set controlPlane.url=http://cp:9000 --set workerToken.value=t
          helm lint deploy/helm/sandboxd-worker --set controlPlane.url=http://cp:9000 --set workerToken.value=t \
            --set executor.enabled=true --set executor.sandboxImage=sandboxd-base:0.3.0

      - name: build sandboxd
        run: cd control-plane && go build -o "$RUNNER_TEMP/sandboxd" ./cmd/sandboxd

      - name: build images (sandbox + worker)
        run: |
          docker build -t sandboxd-e2e:ci scripts/e2e
          docker build -t sandboxd:ci control-plane

      - name: install k3s
        run: |
          curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="$K3S_VERSION" \
            INSTALL_K3S_EXEC="--disable traefik --disable metrics-server --write-kubeconfig-mode 644" sh -
          docker save sandboxd:ci | sudo k3s ctr images import -

      - name: k3s e2e (worker pod joins the fleet, executor runs a sandbox)
        env:
          SANDBOXD_IMAGE: sandboxd-e2e:ci
          SANDBOXD_BIN: ${{ runner.temp }}/sandboxd
          WORKER_IMAGE: sandboxd:ci
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        # PATH is passed through so sudo finds helm (installed in the tool cache).
        run: sudo --preserve-env=SANDBOXD_IMAGE,SANDBOXD_BIN,WORKER_IMAGE,KUBECONFIG env "PATH=$PATH" bash scripts/e2e-k3s.sh
