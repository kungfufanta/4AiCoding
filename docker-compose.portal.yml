# Portal dev stack (docs/PORTAL_PLAN.md 6/S0).
#
#   docker compose -f docker-compose.portal.yml up --build
#
#   postgres :16        Portal's own database (RLS comes in S1)
#   portal   :8080      http://localhost:8080 — /healthz, /readyz
#
# The identity provider (Zitadel, PORTAL_PLAN 3.1) is opt-in so the
# default `up` stays green even without pulling its large image:
#
#   docker compose -f docker-compose.portal.yml --profile idp up
#
#   zitadel  :8081      http://localhost:8081 (init masterkey is dev-only)
#
# It stores its data in the same postgres instance (database `zitadel`,
# created by start-from-init with the postgres superuser).
#
# The sandbox backend (PORTAL_PLAN_V2 P4) is opt-in the same way — the
# dashboard works without it and shows a "not connected" empty state:
#
#   docker compose -f docker-compose.portal.yml --profile sandboxes up \
#     -e PORTAL_SANDBOXD_URL=http://sandboxd:9191
#
#   sandboxd :9191      real sandboxd (auth disabled — dev only) with the
#                       host docker socket, so sandboxes run as siblings;
#   sandbox-image       builds the tiny e2e sandbox base image (no net).
# The sandboxd lifecycle webhook is pre-wired (dev secret) so the
# Portal's index stays live without polling.

name: portal

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    ports:
      # Host port 5433 so it can run next to the main docker-compose.yml.
      - "127.0.0.1:5433:5432"
    volumes:
      - portal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 2s
      timeout: 3s
      retries: 30

  portal:
    build: ./portal
    image: portal:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORTAL_ADDR: ":8080"
      PORTAL_DATABASE_URL: postgres://portal:portal@postgres:5432/portal
      PORTAL_DEBUG: ${PORTAL_DEBUG:-}
      # Local password login: off unless PORTAL_ADMIN_PASSWORD is set
      # (min 12 chars). There is no default password.
      PORTAL_ADMIN_USERNAME: ${PORTAL_ADMIN_USERNAME:-}
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD:-}
      PORTAL_ADMIN_EMAIL: ${PORTAL_ADMIN_EMAIL:-}
      # Master key for stored LLM keys (A2). The default is a dev-only
      # passphrase so keys saved locally survive restarts; never reuse it
      # outside this compose stack.
      PORTAL_SECRETS_KEY: ${PORTAL_SECRETS_KEY:-dev-only-portal-secrets-key}
      # Sandbox gateway (P4): empty until the `sandboxes` profile is up
      # (the preview workflow passes PORTAL_SANDBOXD_URL explicitly).
      PORTAL_SANDBOXD_URL: ${PORTAL_SANDBOXD_URL:-}
      PORTAL_SANDBOXD_API_KEY: ${PORTAL_SANDBOXD_API_KEY:-}
      PORTAL_SANDBOXD_WEBHOOK_SECRET: ${PORTAL_SANDBOXD_WEBHOOK_SECRET:-}
    ports:
      - "8080:8080"
    read_only: true
    tmpfs: [/tmp]

  # --- P4 sandbox backend (profile `sandboxes`) ------------------------

  sandbox-image:
    # Build-only helper: tags the tiny e2e base image so sandboxd's
    # allowlist has something to point at. Exits immediately.
    build: ./scripts/e2e
    image: sandboxd-e2e:ci
    command: ["true"]
    restart: "no"
    profiles: [sandboxes]

  sandboxd:
    build: ./control-plane
    image: sandboxd:portal-dev
    profiles: [sandboxes]
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    # Root on purpose (like production): sandboxd must delete workspace
    # files written by the sandbox user (uid 1000).
    environment:
      SANDBOXD_ADDR: ":9191"
      # Dev only: the dashboard's own auth protects the portal; sandboxd
      # is never exposed past localhost here.
      SANDBOXD_API_AUTH_DISABLED: "true"
      SANDBOXD_IMAGE: sandboxd-e2e:ci
      SANDBOXD_IMAGE_ALLOWLIST: sandboxd-e2e:ci
      SANDBOXD_MAX_MEMORY_MB: "2048"
      # Symmetric data dir (docker-compose.yml contract): the container
      # path and the host path must be THE SAME, because sibling sandbox
      # containers mount `<WorkspaceMnt>:/home/sandbox` and that mount is
      # resolved by the HOST daemon. A named volume (or an asymmetric
      # bind) hands every sandbox an empty directory — files written by
      # the files API are invisible to exec (the A3.4 browser test
      # caught this: write_file ok, `cat hello.txt` → No such file).
      SANDBOXD_DATA_DIR: ${SANDBOXD_DATA_DIR:-/var/lib/sandboxd-portal}
      SANDBOXD_LOG_DIR: ${SANDBOXD_DATA_DIR:-/var/lib/sandboxd-portal}/log
      SANDBOXD_MIGRATIONS: /usr/local/share/sandboxd/migrations
      SANDBOXD_DB: ${SANDBOXD_DATA_DIR:-/var/lib/sandboxd-portal}/sandboxd.db
      SANDBOXD_USERNS: host
      SANDBOXD_IDLE_THRESHOLD_SECONDS: "3600"
      # Lifecycle webhook -> the Portal's receiver (P4): HMAC-signed.
      SANDBOXD_WEBHOOK_URL: http://portal:8080/api/webhooks/sandboxd
      SANDBOXD_WEBHOOK_SECRET: ${PORTAL_SANDBOXD_WEBHOOK_SECRET:-dev-webhook-secret}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SANDBOXD_DATA_DIR:-/var/lib/sandboxd-portal}:${SANDBOXD_DATA_DIR:-/var/lib/sandboxd-portal}
    ports:
      - "127.0.0.1:9191:9191"

  fake-llm:
    # A3.4 Playwright (profile `e2e`): a deterministic OpenAI-compatible
    # SSE server (scripts/e2e/fake-llm) driving the fixed agent scenario
    # write_file hello.txt → run_command cat → finish. The browser test
    # creates a PLATFORM connection pointing at
    # http://fake-llm:9999/v1 (platform connections may point
    # internally — the SSRF guard only applies to org connections).
    # Local: curl http://127.0.0.1:9999/healthz
    build: ./scripts/e2e/fake-llm
    image: fake-llm:dev
    profiles: [e2e]
    ports:
      - "127.0.0.1:9999:9999"

  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    profiles: [idp]
    depends_on:
      postgres:
        condition: service_healthy
    command: start-from-init --masterkey "$ZITADEL_MASTERKEY" --config /zitadel-config.yaml
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: portal
      ZITADEL_EXTERNALSECURE: "false"
    ports:
      - "8081:8080"

volumes:
  portal_pgdata:
