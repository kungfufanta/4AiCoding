{{- $k8s := and .Values.executor.enabled (eq .Values.executor.engine "kubernetes") -}}
{{- if $k8s }}
# M8 kubernetes engine: the executor drives sandbox Pods (and their
# Service/NetworkPolicy/Ingress) through the Kubernetes API, so the
# token IS mounted and the RBAC below is the least privilege it gets:
# full pod lifecycle on the sandbox objects, nothing cluster-wide.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sandboxd-worker.fullname" . }}
  labels:
    {{- include "sandboxd-worker.labels" . | nindent 4 }}
{{- else }}
# The worker never talks to the Kubernetes API: no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sandboxd-worker.fullname" . }}
  labels:
    {{- include "sandboxd-worker.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
