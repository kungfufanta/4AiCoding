{{- include "sandboxd-worker.validate" . -}}
apiVersion: apps/v1
kind: {{ .Values.kind }}
metadata:
  name: {{ include "sandboxd-worker.fullname" . }}
  labels:
    {{- include "sandboxd-worker.labels" . | nindent 4 }}
spec:
  {{- if eq .Values.kind "Deployment" }}
  # One worker per node id: never run two pods with the same id.
  replicas: 1
  strategy:
    type: Recreate
  {{- else }}
  updateStrategy:
    type: RollingUpdate
  {{- end }}
  selector:
    matchLabels:
      {{- include "sandboxd-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sandboxd-worker.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "sandboxd-worker.fullname" . }}
      {{- if and .Values.executor.enabled (eq .Values.executor.engine "kubernetes") }}
      # The kubernetes engine drives sandbox objects through the API
      # (least-privilege Role rendered in rbac.yaml).
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      enableServiceLinks: false
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.executor.enabled }}
      # Executor: sandboxd drives the node's Docker and owns workspace files
      # written by the sandbox user, so it runs as root on the host network.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- else }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if not .Values.executor.enabled }}
          args: ["worker"]
          {{- end }}
          env:
            - name: SANDBOXD_CONTROL_PLANE_URL
              value: {{ .Values.controlPlane.url | quote }}
            - name: SANDBOXD_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "sandboxd-worker.secretName" . }}
                  key: {{ .Values.workerToken.existingSecretKey }}
            - name: SANDBOXD_NODE_ID
              {{- if .Values.nodeId }}
              value: {{ .Values.nodeId | quote }}
              {{- else }}
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
              {{- end }}
            {{- with .Values.address }}
            - name: SANDBOXD_NODE_ADDRESS
              value: {{ . | quote }}
            {{- end }}
            {{- if gt (float64 .Values.capacity.cpus) 0.0 }}
            - name: SANDBOXD_CAPACITY_CPUS
              value: {{ .Values.capacity.cpus | quote }}
            {{- end }}
            {{- if gt (int .Values.capacity.memoryMB) 0 }}
            - name: SANDBOXD_CAPACITY_MEMORY_MB
              value: {{ .Values.capacity.memoryMB | quote }}
            {{- end }}
            {{- if gt (int .Values.capacity.diskMB) 0 }}
            - name: SANDBOXD_CAPACITY_DISK_MB
              value: {{ .Values.capacity.diskMB | quote }}
            {{- end }}
            - name: SANDBOXD_HEARTBEAT_INTERVAL_SECONDS
              value: {{ .Values.heartbeatIntervalSeconds | quote }}
            {{- if and .Values.executor.enabled (eq .Values.executor.engine "kubernetes") }}
            - name: SANDBOXD_EXECUTOR_ENGINE
              value: kubernetes
            {{- with .Values.executor.namespace }}
            - name: SANDBOXD_K8S_NAMESPACE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.executor.ingressDomain }}
            - name: SANDBOXD_K8S_INGRESS_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.executor.ingressClass }}
            - name: SANDBOXD_K8S_INGRESS_CLASS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.executor.proxySelector }}
            - name: SANDBOXD_K8S_PROXY_SELECTOR
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.executor.enabled }}
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: SANDBOXD_ADDR
              value: "$(HOST_IP):{{ .Values.executor.port }}"
            {{- if not .Values.address }}
            - name: SANDBOXD_NODE_ADDRESS
              value: "http://$(HOST_IP):{{ .Values.executor.port }}"
            {{- end }}
            - name: SANDBOXD_IMAGE
              value: {{ .Values.executor.sandboxImage | quote }}
            - name: SANDBOXD_DATA_DIR
              value: {{ .Values.executor.dataDir | quote }}
            - name: SANDBOXD_LOG_DIR
              value: "{{ .Values.executor.dataDir }}/log"
            - name: SANDBOXD_NETWORK
              value: {{ .Values.executor.network | quote }}
            - name: SANDBOXD_API_AUTH_DISABLED
              value: "false"
            {{- with .Values.executor.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            {{- if .Values.executor.enabled }}
            # root without privileges: CHOWN/DAC_OVERRIDE/FOWNER for the
            # workspace files, nothing else.
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
            {{- else }}
            capabilities:
              drop: ["ALL"]
            {{- end }}
          {{- if .Values.executor.enabled }}
          volumeMounts:
            {{- if ne .Values.executor.engine "kubernetes" }}
            - name: docker-sock
              mountPath: /var/run/docker.sock
            {{- end }}
            - name: data
              mountPath: {{ .Values.executor.dataDir }}
            - name: tmp
              mountPath: /tmp
          {{- end }}
          {{- with (ternary .Values.executor.resources .Values.resources .Values.executor.enabled) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      terminationGracePeriodSeconds: {{ if .Values.executor.enabled }}30{{ else }}10{{ end }}
      {{- if .Values.executor.enabled }}
      volumes:
        {{- if ne .Values.executor.engine "kubernetes" }}
        - name: docker-sock
          hostPath:
            path: {{ .Values.executor.dockerSocket }}
            type: Socket
        {{- end }}
        - name: data
          hostPath:
            path: {{ .Values.executor.dataDir }}
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
