{{- include "sandboxd-worker.validate" . -}}
{{- if not .Values.workerToken.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sandboxd-worker.fullname" . }}
  labels:
    {{- include "sandboxd-worker.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.workerToken.existingSecretKey }}: {{ .Values.workerToken.value | b64enc | quote }}
{{- end }}
