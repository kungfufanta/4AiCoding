# sandboxd-worker: joins Kubernetes nodes to a sandboxd control plane fleet.
#
# Two modes:
#   - default (executor.enabled=false): the worker only registers, heartbeats
#     its capacity and honours drain. The pod runs non-root, read-only, with
#     no host access at all.
#   - executor (executor.enabled=true, M7b, PLAN "B1"): each pod is a full
#     sandboxd that RUNS sandboxes on its node's Docker daemon, and the
#     control plane places sandboxes on it. This needs the node's Docker
#     socket, a host data directory and the host network: root on the node.
#     Only enable it on nodes dedicated to sandboxes.

controlPlane:
  # Base URL of the control plane API as seen from the pods (required),
  # e.g. http://sandboxd-ctl.example.internal:9000
  url: ""

workerToken:
  # The control plane's SANDBOXD_WORKER_TOKEN. Either give the value here
  # (a Secret is created) or name an existing Secret holding it.
  value: ""
  existingSecret: ""
  existingSecretKey: worker-token

# DaemonSet (one worker per node; the node id is the Kubernetes node name, so
# it stays the same across pod restarts) or Deployment (a single worker; set
# nodeId, otherwise the id would change with every new pod).
kind: DaemonSet

# Fixed node id (Deployment only). Must match [a-z0-9][a-z0-9.-]{0,62}.
nodeId: ""

# Base URL other machines can reach this worker on (optional; reported to the
# control plane as the node address).
address: ""

# Advertised capacity. 0 = detect (CPU count and MemTotal as the pod sees them).
capacity:
  cpus: 0
  memoryMB: 0
  diskMB: 0

heartbeatIntervalSeconds: 10

executor:
  enabled: false
  # Sandbox executor engine (M8):
  #   - docker: sandboxes are containers on the node's Docker daemon
  #     (the default; needs executor.dockerSocket).
  #   - kubernetes: sandboxes are Pods (+Service/NetworkPolicy/Ingress)
  #     in executor.namespace, driven through the Kubernetes API. Needs
  #     the ServiceAccount RBAC this chart renders for it.
  engine: docker
  # Kubernetes engine: namespace for sandbox pods ("" = the release
  # namespace), Ingress hosts for preview URLs ("" = PREVIEW_DOMAIN on
  # the executor), ingress class, and the pod label selector (k=v,k=v)
  # sandbox egress may additionally reach (the egress proxy pods).
  namespace: ""
  ingressDomain: ""
  ingressClass: ""
  proxySelector: ""
  # Sandbox image the node runs (must be pullable in the cluster).
  sandboxImage: ""
  # Port the node API listens on, on the node's IP (host network). The
  # control plane calls http://<node InternalIP>:<port>; only its node token
  # is accepted there.
  port: 9300
  # Host directory for workspaces and state; mounted at the same path
  # (sandboxd bind-mounts workspaces into sibling containers by host path).
  dataDir: /var/lib/sandboxd-worker
  dockerSocket: /var/run/docker.sock
  # Docker network sandboxes join ("" = the default bridge). Create it on
  # each node first, e.g. `docker network create --internal sandboxd_net`.
  network: ""
  # Resources of the executor pod (sandboxd itself, not the sandboxes).
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi
  # Extra sandboxd settings (SANDBOXD_MAX_MEMORY_MB, PREVIEW_DOMAIN, ...).
  env: []

image:
  repository: sandboxd
  tag: ""          # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
podAnnotations: {}
podLabels: {}

# Extra environment variables for the worker container.
extraEnv: []
