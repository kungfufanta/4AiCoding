# Portal — SaaS layer in front of sandboxd (docs/PORTAL_PLAN.md).
# The binary applies its own migrations at boot, so no init job is
# needed; give it a Postgres DSN and (from S3) the sandboxd address.

replicaCount: 1

image:
  repository: portal
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  # Created by the chart; set create=false + name to reuse one.
  create: true
  name: ""
  annotations: {}

database:
  # Postgres DSN of the Portal's own database (required), e.g.
  # postgres://portal:portal@portal-postgres:5432/portal
  # Either give the value here (a Secret is created) or name an
  # existing Secret holding it.
  url: ""
  existingSecret: ""
  existingSecretKey: database-url

# Public URL of the dashboard/API (S1 cookies + OIDC redirect), e.g.
# https://app.example.com
publicURL: ""

# OIDC provider (S1 login; empty leaves login disabled).
oidc:
  issuer: ""
  clientID: ""
  clientSecret: ""

# Sandboxd gateway (PORTAL_PLAN_V2 P4 / PORTAL_PLAN 6/S3). An empty url
# disables the whole sandbox surface (/v1/sandboxes* answers 503 and the
# dashboard shows "backend not connected"). The api key is a sandboxd
# API key carrying the require_external flag (P3a) plus the
# sandbox:create/read/exec AND sandboxes:files scopes (the files scope
# is required by A1 — without it the gateway's proxy to /v1/sandboxes/{id}/files*
# gets 403 from sandboxd); the webhook secret must match that
# deployment's SANDBOXD_WEBHOOK_SECRET. For production prefer injecting
# apiKey/webhookSecret via existingSecret + extraEnv instead of values.
sandboxd:
  url: ""
  apiKey: ""
  webhookSecret: ""
  timeout: 30s

# Bootstrap password login (user "admin"). Off unless the database
# Secret above carries this key (min 12 chars); there is no default
# password.
adminLogin:
  passwordKey: admin-password

# Chat page (Chat MVP). The API key lives in the database Secret
# under apiKeyKey; without it the page shows "not configured". Empty
# values keep the binary defaults (WebHub, glm-4.6, flavor webhub).
chat:
  apiKeyKey: llm-api-key
  baseURL: ""
  model: ""
  flavor: ""

# Master key (PORTAL_SECRETS_KEY) that encrypts stored LLM API keys
# (A2). Name an existing Secret holding it; empty leaves the env unset
# and saving/using stored keys fails. Never rotate it once keys are
# stored: the old ciphertexts become unreadable.
secretsKey:
  existingSecret: ""
  existingSecretKey: secrets-key

service:
  type: ClusterIP
  port: 80

podAnnotations: {}
podLabels: {}

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

# The image runs as nonroot (distroless); keep the guardrails on.
# Passes PodSecurity "restricted". 65532 is the distroless "nonroot" user
# that portal/Dockerfile runs as.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: app.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Extra environment for the portal container (PORTAL_* not covered
# above, e.g. PORTAL_DEBUG: "1" in dev).
extraEnv: []

nodeSelector: {}
tolerations: []
affinity: {}
