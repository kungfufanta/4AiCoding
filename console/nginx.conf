# Serves the console SPA and proxies the API on the same origin, so the
# HttpOnly session cookie works without CORS.
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  include /etc/nginx/snippets/security-headers.conf;

  location /v1/ {
    proxy_pass http://sandboxd-ctl:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Logs and metrics streams are Server-Sent Events.
    proxy_buffering off;
    proxy_read_timeout 1h;
    client_max_body_size 1m;
  }

  # Build identity for the sidebar footer (unauthenticated, version + commit only).
  location = /version {
    proxy_pass http://sandboxd-ctl:9000;
    proxy_set_header Host $host;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
